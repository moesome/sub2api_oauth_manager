<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>OAuth 管理 · Sub2API</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #e6eaf0;
      --line-strong: #d7dee9;
      --text: #172033;
      --muted: #697386;
      --subtle: #98a2b3;
      --primary: #5865d9;
      --primary-dark: #4652c5;
      --primary-soft: #eef0ff;
      --success: #15966c;
      --success-soft: #e8f8f1;
      --warning: #c77b15;
      --warning-soft: #fff5df;
      --danger: #d34f5f;
      --danger-soft: #fff0f1;
      --gray-soft: #f0f2f5;
      --shadow: 0 8px 28px rgba(38, 52, 77, .06);
      --shadow-hover: 0 12px 32px rgba(38, 52, 77, .1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 94% -12%, rgba(113, 128, 255, .12), transparent 32%),
        radial-gradient(circle at -8% 18%, rgba(97, 211, 183, .08), transparent 27%),
        var(--page);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .wrap { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 64px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .brand { display: flex; align-items: flex-start; gap: 14px; }
    .brand-icon {
      display: grid; width: 44px; height: 44px; flex: 0 0 44px; place-items: center; color: #fff;
      background: linear-gradient(145deg, #6977ec, #4d5ad0); border-radius: 14px;
      box-shadow: 0 8px 18px rgba(88, 101, 217, .24);
    }
    .brand-icon svg { width: 23px; height: 23px; }
    .eyebrow { margin: 1px 0 5px; color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .title { margin: 0; color: var(--text); font-size: clamp(25px, 3vw, 32px); font-weight: 760; letter-spacing: -.035em; line-height: 1.15; }
    .sub { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .connection {
      display: flex; align-items: center; gap: 11px; min-width: 190px; padding: 12px 15px;
      background: rgba(255, 255, 255, .8); border: 1px solid rgba(215, 222, 233, .9); border-radius: 14px;
      box-shadow: 0 5px 18px rgba(38, 52, 77, .04);
    }
    .connection-dot { width: 9px; height: 9px; flex: 0 0 9px; background: var(--success); border-radius: 50%; box-shadow: 0 0 0 4px var(--success-soft); }
    .connection-dot.pending { background: var(--warning); box-shadow: 0 0 0 4px var(--warning-soft); }
    .connection strong, .connection small { display: block; }
    .connection strong { font-size: 13px; }
    .connection small { margin-top: 1px; color: var(--muted); font-size: 11px; }

    .panel { background: rgba(255, 255, 255, .94); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .summary { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 18px; }
    .metric {
      display: flex; align-items: center; gap: 12px; min-height: 92px; padding: 17px 18px;
      background: rgba(255, 255, 255, .86); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 5px 20px rgba(38, 52, 77, .035);
    }
    .metric-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; }
    .metric-icon svg { width: 19px; height: 19px; }
    .metric:nth-child(1) .metric-icon { color: #5965d8; background: var(--primary-soft); }
    .metric-label, .metric-note { display: block; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric-value { display: block; margin-top: 1px; color: var(--text); font-size: 23px; font-weight: 760; line-height: 1.15; }
    .metric-note { margin-top: 2px; color: var(--subtle); font-size: 11px; }
    .metric-action { flex: 0 0 auto; margin-left: auto; padding: 7px 9px; color: var(--primary-dark); background: var(--primary-soft); border-color: #c9cdf8; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .metric-action:hover:not(:disabled) { color: #fff; background: var(--primary); border-color: var(--primary); }
    .connection-action { flex: 0 0 auto; margin-left: auto; padding: 7px 10px; color: var(--primary-dark); background: var(--primary-soft); border-color: #c9cdf8; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .connection-action:hover:not(:disabled) { color: #fff; background: var(--primary); border-color: var(--primary); }

    .proxy-summary { grid-column: 1 / -1; display: block; padding: 18px 20px 20px; }
    .proxy-summary-head { display: flex; align-items: center; gap: 12px; }
    .proxy-summary-head .metric-icon { flex: 0 0 38px; }
    .proxy-summary-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 12px; margin-top: 16px; }
    .proxy-summary-item { min-width: 0; padding: 13px; background: linear-gradient(180deg, #fff, #fbfcff); border: 1px solid var(--line); border-radius: 13px; }
    .proxy-summary-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
    .proxy-summary-item-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .proxy-summary-item-name strong { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .proxy-summary-item-meta { margin: 3px 0 0 16px; color: var(--subtle); font-size: 10px; }
    .proxy-summary-metrics { display: grid; grid-template-columns: minmax(110px, .9fr) minmax(55px, .45fr); gap: 12px; margin-top: 13px; }
    .proxy-summary-metric-label { display: block; color: var(--subtle); font-size: 10px; }
    .proxy-summary-latency strong, .proxy-summary-account-count strong { display: block; margin-top: 2px; color: var(--text); font-size: 14px; font-weight: 750; line-height: 1.2; }
    .proxy-summary-latency.good strong { color: var(--success); }
    .proxy-summary-latency.warn strong { color: var(--warning); }
    .proxy-summary-latency.bad strong { color: var(--danger); }
    .proxy-summary-latency small { display: block; overflow: hidden; margin-top: 3px; color: var(--subtle); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .proxy-summary-token { grid-column: 1 / -1; min-width: 0; padding-top: 10px; border-top: 1px solid var(--line); }
    .proxy-summary-token-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .proxy-summary-token-head strong { color: var(--muted); font-size: 10px; font-weight: 700; }
    .proxy-summary-token-head small { color: var(--subtle); font-size: 9px; }
    .proxy-summary-chart-wrap { min-width: 0; margin-top: 7px; }
    .proxy-summary-chart-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; }
    .proxy-summary-chart-legend-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .proxy-summary-chart-swatch { width: 16px; height: 2px; border-radius: 2px; }
    .proxy-summary-chart-swatch.average { background: #5865d9; }
    .proxy-summary-chart-swatch.p95 { background: #c77b15; }
    .proxy-summary-chart-swatch.p99 { background: #d34f5f; }
    .proxy-summary-chart { display: block; width: 100%; margin-top: 3px; overflow: visible; }
    .proxy-summary-chart-grid { stroke: #edf0f4; stroke-width: 1; }
    .proxy-summary-chart-axis { stroke: #cfd6e2; stroke-width: 1; }
    .proxy-summary-chart-label, .proxy-summary-chart-axis-title { fill: var(--subtle); font-family: inherit; font-size: 9px; }
    .proxy-summary-chart-axis-title { fill: var(--muted); font-size: 9px; }
    .proxy-summary-chart-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .proxy-summary-chart-empty { min-height: 118px; display: grid; place-items: center; padding: 14px; color: var(--subtle); background: var(--surface-soft); border-radius: 8px; font-size: 11px; text-align: center; }
    .proxy-summary-empty { grid-column: 1 / -1; padding: 10px 0 2px; color: var(--subtle); font-size: 12px; }

    .assign { margin-bottom: 22px; padding: 0 18px 18px; }
    .assign-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 74px; }
    .assign-copy, .assign-controls { display: flex; align-items: center; gap: 11px; }
    .assign-copy { min-width: 0; }
    .assign-copy strong { white-space: nowrap; }
    .section-kicker { color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: .08em; white-space: nowrap; }
    .selected { padding-left: 11px; color: var(--muted); font-size: 12px; border-left: 1px solid var(--line-strong); white-space: nowrap; }
    select {
      min-width: 180px; padding: 9px 34px 9px 12px; color: var(--text); background-color: #fff;
      background-image: linear-gradient(45deg, transparent 50%, #8b95a7 50%), linear-gradient(135deg, #8b95a7 50%, transparent 50%);
      background-position: calc(100% - 16px) 14px, calc(100% - 11px) 14px; background-repeat: no-repeat; background-size: 5px 5px, 5px 5px;
      border: 1px solid var(--line-strong); border-radius: 10px; appearance: none;
    }
    select:focus { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    button { padding: 9px 14px; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; transition: .18s ease; }
    button:hover:not(:disabled) { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    button.primary { color: #fff; background: linear-gradient(135deg, #6875e8, #5360d3); border-color: transparent; box-shadow: 0 5px 13px rgba(88, 101, 217, .2); font-weight: 650; }
    button.primary:hover:not(:disabled) { color: #fff; background: linear-gradient(135deg, #5e6bdd, #4b57c6); box-shadow: 0 7px 17px rgba(88, 101, 217, .27); }
    .status { min-width: 0; color: var(--muted); font-size: 12px; text-align: right; }
    .status.error { color: var(--danger); }
    .status.loading { color: var(--primary); }

    .quick-dispatch { margin-bottom: 22px; padding: 18px 20px 20px; }
    .quick-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .quick-title { margin: 3px 0 0; font-size: 17px; font-weight: 720; }
    .quick-description { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .quick-selected { flex: 0 0 auto; padding: 6px 9px; color: var(--muted); background: var(--surface-soft); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; white-space: nowrap; }
    .quick-filter-row { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .quick-filter-label { flex: 0 0 auto; padding-top: 6px; color: var(--subtle); font-size: 12px; font-weight: 650; }
    .quick-groups { display: flex; flex: 1; flex-wrap: wrap; gap: 7px; min-width: 0; }
    .quick-group-option { position: relative; display: inline-flex; max-width: 100%; }
    .quick-group-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .quick-group-option span { display: inline-flex; max-width: 100%; padding: 6px 10px; overflow: hidden; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 12px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; transition: .18s ease; }
    .quick-group-option span:hover { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    .quick-group-option input:checked + span { color: var(--primary-dark); background: var(--primary-soft); border-color: #b8bef4; font-weight: 650; }
    .quick-group-option input:focus-visible + span { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .quick-note { padding: 6px 0; color: var(--subtle); font-size: 12px; }
    .quick-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 14px; padding-top: 12px; }
    .quick-card { min-width: 0; padding: 11px; background: linear-gradient(180deg, #fff, #fcfdff); border: 1px solid var(--line); border-radius: 11px; }
    .quick-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; margin-bottom: 10px; }
    .quick-card-head > div:first-child { min-width: 0; }
    .quick-card-title { min-width: 0; overflow: hidden; color: var(--text); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .quick-card-meta { margin-top: 2px; color: var(--subtle); font-size: 10px; }
    .quick-account-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .quick-account { position: relative; display: grid; width: 100%; aspect-ratio: 1; place-items: center; min-width: 0; padding: 2px; overflow: hidden; color: #667085; background: var(--gray-soft); border: 1px solid #e0e4ea; border-radius: 7px; box-shadow: none; transition: .18s ease; }
    .quick-account:hover:not(:disabled) { color: #59656f; background: #e8ebef; border-color: #cbd2dd; transform: translateY(-1px); }
    .quick-account.on { color: var(--success); background: var(--success-soft); border-color: #bcebd8; }
    .quick-account.on:hover:not(:disabled) { color: #107a57; background: #dcf5e9; border-color: #91dbbd; }
    .quick-account-status { position: absolute; top: 3px; right: 3px; z-index: 1; display: inline-flex; align-items: center; gap: 2px; max-width: calc(100% - 6px); font-size: 8px; font-weight: 760; line-height: 1; white-space: nowrap; }
    .quick-account-status i { width: 4px; height: 4px; flex: 0 0 4px; border-radius: 50%; background: currentColor; }
    .quick-account-status.normal { color: var(--success); }
    .quick-account-status.limited { color: var(--warning); }
    .quick-account-status.error { color: var(--danger); }
    .quick-account-percent { min-width: 0; max-width: 100%; padding: 0 1px; font-size: 10px; font-weight: 760; line-height: 1.1; white-space: nowrap; }
    .quick-card-empty { grid-column: 1 / -1; padding: 12px 4px 10px; color: var(--subtle); font-size: 11px; }

    #list { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    #list.loading { opacity: .72; pointer-events: none; }
    .proxy { overflow: hidden; transition: box-shadow .2s ease, transform .2s ease; }
    .proxy:hover { box-shadow: var(--shadow-hover); }
    .proxy-head { display: grid; grid-template-columns: minmax(220px, 1fr) auto; align-items: center; gap: 12px; padding: 12px 15px; background: linear-gradient(180deg, #fff, #fcfdff); border-bottom: 1px solid var(--line); }
    .proxy-head.unbound { grid-template-columns: minmax(220px, 1fr) auto; }
    .proxy-head.unbound .proxy-count { grid-column: 2; grid-row: 1; }
    .proxy-heading { min-width: 0; }
    .proxy-name-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .proxy-dot { width: 9px; height: 9px; flex: 0 0 9px; background: var(--success); border-radius: 50%; }
    .proxy-dot.inactive, .proxy-dot.expired { background: var(--subtle); }
    .proxy-dot.error { background: var(--danger); }
    .proxy-name { overflow: hidden; font-size: 14px; font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 11px; }
    .proxy-meta { margin-top: 2px; padding-left: 16px; }
    .proxy-status, .badge { display: inline-flex; align-items: center; justify-content: center; min-height: 19px; padding: 2px 6px; border-radius: 999px; font-size: 9px; font-weight: 650; white-space: nowrap; }
    .proxy-status.active, .badge.active, .badge.normal { color: var(--success); background: var(--success-soft); }
    .proxy-status.inactive, .proxy-status.expired, .badge.inactive, .badge.expired, .badge.paused, .badge.unknown { color: #667085; background: var(--gray-soft); }
    .proxy-status.error, .badge.error { color: var(--danger); background: var(--danger-soft); }
    .badge.rate-limited, .badge.overloaded, .badge.temp-unschedulable { color: var(--warning); background: var(--warning-soft); }
    .proxy-count { min-width: 56px; text-align: center; }
    .count { display: block; font-size: 17px; font-weight: 760; line-height: 1.1; }

    .accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 8px 10px 10px; }
    .account { position: relative; display: grid; grid-template-rows: auto auto auto auto; align-content: start; gap: 5px; min-width: 0; min-height: 132px; padding: 8px; overflow: hidden; color: var(--text); background: linear-gradient(180deg, #fff, #fbfcff); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; aspect-ratio: 1.08; transition: .18s ease; }
    .account:hover { border-color: #b8bef4; background: linear-gradient(180deg, #fff, #f8f9ff); box-shadow: 0 5px 14px rgba(38, 52, 77, .08); transform: translateY(-1px); }
    .account.selected { border-color: var(--primary); background: linear-gradient(180deg, #f8f9ff, #eef0ff); box-shadow: 0 0 0 2px rgba(88, 101, 217, .12); }
    .account:focus-within { outline: 3px solid rgba(88, 101, 217, .14); outline-offset: 1px; }
    .account-check { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; white-space: nowrap; border: 0; opacity: 0; clip: rect(0 0 0 0); clip-path: inset(50%); }
    .account-tile-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 5px; min-width: 0; }
    .account-main { min-width: 0; }
    .account-name { overflow: hidden; color: var(--text); font-size: 11px; font-weight: 700; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .account-id { margin-left: 3px; color: var(--subtle); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; font-weight: 500; }
    .account-detail { overflow: hidden; margin-top: 1px; color: var(--subtle); font-size: 9px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .account-select-mark { display: grid; width: 16px; height: 16px; flex: 0 0 16px; place-items: center; color: transparent; background: #fff; border: 1px solid var(--line-strong); border-radius: 5px; font-size: 11px; font-weight: 800; line-height: 1; }
    .account.selected .account-select-mark { color: #fff; background: var(--primary); border-color: var(--primary); }
    .group-cell { min-width: 0; }
    .account-groups { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; max-height: 30px; overflow: hidden; }
    .account-group { display: inline-flex; max-width: 100%; padding: 1px 4px; overflow: hidden; color: #5d4ca1; background: #f2efff; border: 1px solid #e5e0ff; border-radius: 4px; font-size: 9px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .account-groups-empty { color: var(--subtle); font-size: 9px; }
    .account-state-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 5px; min-width: 0; }
    .status-cell, .schedule-cell { min-width: 0; }
    .status-cell small { display: -webkit-box; overflow: hidden; margin-top: 2px; color: var(--subtle); font-size: 9px; line-height: 1.2; text-overflow: ellipsis; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
    .usage { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .usage-ring { position: relative; display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; background: conic-gradient(var(--usage-color, var(--success)) var(--usage-percent, 0%), #edf0f5 0); border-radius: 50%; }
    .usage-ring::before { position: absolute; width: 24px; height: 24px; content: ''; background: #fff; border-radius: 50%; }
    .usage-ring strong { position: relative; z-index: 1; color: var(--text); font-size: 8px; font-weight: 750; line-height: 1; }
    .usage-copy { display: grid; min-width: 0; gap: 1px; }
    .usage-copy strong { overflow: hidden; color: var(--muted); font-size: 9px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .usage-copy small { overflow: hidden; color: var(--subtle); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .usage-empty .usage-ring { --usage-color: #cbd2dd; }
    .accounts > .empty { grid-column: 1 / -1; padding: 20px 12px; font-size: 12px; }
    .empty, .loading-state { padding: 42px 24px; color: var(--muted); text-align: center; }
    .loading-state { border: 1px dashed var(--line-strong); border-radius: 16px; }
    .empty strong, .loading-state strong { display: block; margin-bottom: 4px; color: var(--text); }

    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; padding: 20px; overflow-y: auto; place-items: center; background: rgba(24, 32, 48, .42); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(700px, 100%); margin: auto; overflow: hidden; background: var(--surface); border: 1px solid rgba(215, 222, 233, .95); border-radius: 18px; box-shadow: 0 24px 70px rgba(20, 28, 48, .24); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
    .modal-title { margin: 0; font-size: 19px; font-weight: 750; }
    .modal-description { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .modal-close { width: 32px; height: 32px; padding: 0; color: var(--muted); border-radius: 9px; font-size: 21px; line-height: 1; }
    .modal-body { display: grid; gap: 17px; padding: 20px 22px; }
    .quick-add-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 13px; }
    .form-field { display: grid; gap: 6px; min-width: 0; }
    .form-label { color: var(--text); font-size: 12px; font-weight: 700; }
    .form-hint { color: var(--subtle); font-size: 11px; }
    .form-field select { width: 100%; min-width: 0; }
    .form-field input, .form-field textarea { width: 100%; padding: 9px 11px; color: var(--text); background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; }
    .form-field input:focus, .form-field textarea:focus { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .form-field input[readonly] { color: var(--muted); background: var(--surface-soft); }
    .form-field textarea { min-height: 84px; resize: vertical; }
    .quick-add-groups { display: flex; flex-wrap: wrap; gap: 7px; min-height: 32px; }
    .quick-add-group-option { position: relative; display: inline-flex; max-width: 100%; }
    .quick-add-group-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .quick-add-group-option span { display: inline-flex; max-width: 100%; padding: 6px 10px; overflow: hidden; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 12px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; transition: .18s ease; }
    .quick-add-group-option span:hover { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    .quick-add-group-option input:checked + span { color: var(--primary-dark); background: var(--primary-soft); border-color: #b8bef4; font-weight: 650; }
    .quick-add-group-option input:focus-visible + span { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .quick-add-note { color: var(--subtle); font-size: 11px; }
    .quick-add-note.warning { color: var(--warning); }
    .auth-link-box { display: grid; gap: 8px; padding: 12px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 11px; }
    .auth-link-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .auth-link { display: block; min-width: 0; flex: 1; overflow-wrap: anywhere; color: var(--primary-dark); font-size: 12px; line-height: 1.45; word-break: break-all; white-space: normal; }
    .auth-link.empty { color: var(--subtle); pointer-events: none; }
    .auth-link-row button { flex: 0 0 auto; padding: 7px 9px; font-size: 11px; }
    .modal-status { color: var(--muted); font-size: 12px; }
    .modal-status.error { color: var(--danger); }
    .modal-status.loading { color: var(--primary); }
    .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 9px; padding: 15px 22px 18px; border-top: 1px solid var(--line); }
    .quick-add-compact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }

    @media (max-width: 980px) {
      .quick-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .accounts { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .account { min-height: 126px; }
    }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 24px, 1480px); padding-top: 22px; }
      .top { flex-direction: column; margin-bottom: 20px; }
      .connection { width: 100%; }
      .summary { gap: 9px; }
      .metric { min-height: 78px; padding: 12px; gap: 9px; }
      .metric-icon { width: 32px; height: 32px; flex-basis: 32px; }
      .metric-icon svg { width: 16px; height: 16px; }
      .metric-value { font-size: 19px; }
      .metric-action, .connection-action { padding: 6px 7px; font-size: 10px; }
      .proxy-summary { padding: 14px; }
      .proxy-summary-list { grid-template-columns: 1fr; }
      .assign { padding: 0 14px 14px; }
      .assign-toolbar { align-items: stretch; flex-direction: column; gap: 11px; padding: 14px 0; }
      .assign-copy, .assign-controls { justify-content: space-between; }
      .assign-controls { flex-wrap: wrap; }
      .assign-controls select { flex: 1; min-width: 0; }
      .status { text-align: left; }
      .quick-dispatch { padding: 15px 14px 16px; }
      .quick-cards { grid-template-columns: 1fr; }
      .quick-head { flex-direction: column; gap: 8px; }
      .quick-selected { align-self: flex-start; }
      .quick-filter-row { flex-direction: column; gap: 7px; }
      .quick-filter-label { padding-top: 0; }
      .proxy-head { gap: 10px; padding: 11px 12px; }
      .accounts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; padding: 6px 8px 8px; }
      .account { min-height: 122px; padding: 7px; gap: 4px; aspect-ratio: 1.02; }
      .account-name { font-size: 10px; }
      .account-detail, .account-group, .account-groups-empty, .status-cell small { font-size: 8px; }
      .account-state-row { gap: 3px; }
      .quick-add-grid { grid-template-columns: 1fr; }
      .quick-add-compact-grid { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 12px; }
      .modal-head, .modal-body, .modal-foot { padding-left: 15px; padding-right: 15px; }
      .auth-link-row { flex-wrap: wrap; }
      .auth-link { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4.5 6.2v5.1c0 4.6 3.1 7.9 7.5 9.7 4.4-1.8 7.5-5.1 7.5-9.7V6.2L12 3Z"></path>
            <path d="m8.5 12 2.2 2.2 4.8-4.8"></path>
          </svg>
        </div>
        <div>
          <div class="eyebrow">Sub2API · Admin</div>
          <h1 class="title">OAuth 账号管理</h1>
          <div class="sub">代理、OpenAI OAuth 账号与调度状态</div>
        </div>
      </div>
      <div class="connection" id="connection">
        <span class="connection-dot pending" id="connectionDot"></span>
        <div>
          <strong id="connectionText">检查登录状态</strong>
          <small>复用 Sub2API 同源登录态</small>
        </div>
        <button class="connection-action" id="quickAddButton" type="button" disabled>新增账号</button>
      </div>
    </header>

    <section class="summary" aria-label="概览">
      <div class="metric proxy-summary" id="proxySummary">
        <div class="proxy-summary-head">
          <div class="metric-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h.01M11 9h6M7 13h10"></path></svg>
          </div>
          <div><span class="metric-label">代理</span><strong class="metric-value" id="proxyCount">—</strong><span class="metric-note">按接口返回顺序展示</span></div>
        </div>
        <div class="proxy-summary-list" id="proxySummaryList" aria-live="polite">
          <span class="proxy-summary-empty">正在加载代理…</span>
        </div>
      </div>
    </section>

    <section class="panel quick-dispatch" id="quickDispatch" aria-label="快速调度">
      <div class="quick-head">
        <div>
          <div class="section-kicker">快速调度</div>
          <h2 class="quick-title">按分组快速切换账号调度</h2>
          <p class="quick-description">绿色为调度中，灰色为暂停中；点击方块即可切换。</p>
        </div>
        <span class="quick-selected" id="quickSelected">已选 0 个分组</span>
      </div>
      <div class="quick-filter-row">
        <span class="quick-filter-label">分组</span>
        <div class="quick-groups" id="quickGroups" aria-label="选择快速调度分组">
          <span class="quick-note">正在加载分组…</span>
        </div>
      </div>
      <div id="quickCards" class="quick-cards" aria-live="polite">
        <div class="loading-state">正在加载快速调度…</div>
      </div>
    </section>

    <section class="panel assign" aria-label="批量操作">
      <div class="assign-toolbar">
        <div class="assign-copy">
          <span class="section-kicker">批量操作</span>
          <strong>移动选中的账号</strong>
          <span id="selected" class="selected">已选 0 个账号</span>
        </div>
        <div class="assign-controls">
          <select id="target" aria-label="选择目标代理">
            <option value="">选择目标代理…</option>
          </select>
          <button class="primary" id="move" type="button" disabled>移动账号</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </div>
      <div id="list" aria-live="polite">
        <div class="loading-state">正在加载代理和账号…</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="quickAddModal" hidden aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="quickAddTitle">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="quickAddTitle">快速添加 OAuth 账号</h2>
          <p class="modal-description">自动分配账号最少的可用代理，授权完成后使用邮箱创建账号。</p>
        </div>
        <button class="modal-close" type="button" data-close-quick-add aria-label="关闭快速添加">×</button>
      </div>
      <div class="modal-body">
        <div class="quick-add-grid">
          <label class="form-field">
            <span class="form-label">代理</span>
            <select id="quickAddProxy" aria-label="选择快速添加代理"></select>
          </label>
          <label class="form-field">
            <span class="form-label">模型限制</span>
            <input id="quickAddModel" type="text" value="gpt-5.6-luna" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <div class="quick-add-compact-grid">
          <label class="form-field">
            <span class="form-label">并发数</span>
            <input id="quickAddConcurrency" type="number" min="1" step="1" value="2" inputmode="numeric">
            <span class="form-hint">单个账号允许的同时请求数</span>
          </label>
          <label class="form-field">
            <span class="form-label">优先级</span>
            <input id="quickAddPriority" type="number" min="0" step="1" value="1" inputmode="numeric">
            <span class="form-hint">数值越小，调度优先级越高</span>
          </label>
          <label class="form-field">
            <span class="form-label">Codex 指纹收敛</span>
            <select id="quickAddFingerprintMode" aria-label="选择 Codex 指纹收敛模式">
              <option value="off" selected>关闭</option>
              <option value="device">设备级</option>
              <option value="session">会话级</option>
              <option value="full">完全收敛</option>
            </select>
            <span class="form-hint">非关闭模式由后端自动管理指纹</span>
          </label>
        </div>

        <div class="form-field">
          <span class="form-label">分组</span>
          <div class="quick-add-groups" id="quickAddGroups" aria-label="选择快速添加分组"></div>
          <span class="quick-add-note" id="quickAddGroupNote"></span>
        </div>

        <div class="form-field">
          <span class="form-label">授权链接</span>
          <div class="auth-link-box">
            <div class="auth-link-row">
              <a class="auth-link empty" id="quickAddAuthLink" href="#" target="_blank" rel="noopener noreferrer">正在生成…</a>
              <button id="quickAddCopy" type="button" disabled>复制</button>
              <button id="quickAddRefresh" type="button">刷新</button>
            </div>
          </div>
        </div>

        <label class="form-field">
          <span class="form-label">授权回调 URL</span>
          <textarea id="quickAddCallback" placeholder="粘贴授权完成后的回调 URL" spellcheck="false"></textarea>
        </label>
        <div class="modal-status" id="quickAddStatus" role="status" aria-live="polite"></div>
      </div>
      <div class="modal-foot">
        <button type="button" data-close-quick-add>取消</button>
        <button class="primary" id="quickAddSubmit" type="button" disabled>授权并添加</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const state = {
        proxies: [],
        groups: [],
        accounts: [],
        latency: {},
        firstToken: { metrics: {}, loading: false, error: '' },
        selected: new Set(),
        quickGroupIDs: new Set(),
        quickGroupsInitialized: false,
        scheduleUpdating: new Set(),
        loading: false,
        loaded: false,
        quickAdd: {
          proxyId: '',
          sessionId: '',
          authUrl: '',
          groupIDs: new Set(),
          missingGroups: [],
          generating: false,
          submitting: false,
          requestVersion: 0
        }
      };

      const statusLabels = {
        active: '正常',
        normal: '正常',
        inactive: '已停用',
        error: '错误',
        expired: '已过期',
        rate_limited: '限流中',
        overloaded: '过载',
        temp_unschedulable: '暂不可调度',
        unknown: '未知状态'
      };

      const proxyStatusLabels = {
        active: '运行中',
        inactive: '已停用',
        expired: '已过期',
        error: '错误'
      };

      const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);

      const unwrap = (json) => {
        if (!json || json.code === undefined) return json;
        if (json.code === 0) return json.data;
        throw new Error(json.message || 'API 返回错误');
      };

      function readStorage(key) {
        try {
          return localStorage.getItem(key) || '';
        } catch {
          return '';
        }
      }

      function readAuthToken() {
        return readStorage('auth_token').trim();
      }

      let refreshingToken = null;
      async function refreshAuthToken() {
        if (refreshingToken) return refreshingToken;
        const refreshToken = readStorage('refresh_token').trim();
        if (!refreshToken) return false;

        refreshingToken = (async () => {
          try {
            const response = await fetch('/api/v1/auth/refresh', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh_token: refreshToken })
            });
            const json = await response.json();
            if (!response.ok) return false;
            const tokens = unwrap(json);
            if (!tokens?.access_token) return false;
            localStorage.setItem('auth_token', tokens.access_token);
            if (tokens.refresh_token) localStorage.setItem('refresh_token', tokens.refresh_token);
            if (tokens.expires_in) localStorage.setItem('token_expires_at', String(Date.now() + tokens.expires_in * 1000));
            return true;
          } catch {
            return false;
          }
        })().finally(() => {
          refreshingToken = null;
        });
        return refreshingToken;
      }

      async function api(path, options = {}, canRefresh = true) {
        const token = readAuthToken();
        if (!token) throw new Error('请先登录 Sub2API');
        const response = await fetch('/api/v1' + path, {
          ...options,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
            ...(options.headers || {})
          }
        });
        if (response.status === 401 && canRefresh && await refreshAuthToken()) return api(path, options, false);
        let json;
        try {
          json = await response.json();
        } catch {
          throw new Error('服务器返回了非 JSON 内容（HTTP ' + response.status + '）');
        }
        if (!response.ok) throw new Error(json.message || json.error || ('HTTP ' + response.status));
        return unwrap(json);
      }

      const arrayFrom = (value) => {
        if (Array.isArray(value)) return value;
        if (value && Array.isArray(value.items)) return value.items;
        if (value && Array.isArray(value.requests)) return value.requests;
        if (value && value.data && value.data !== value) return arrayFrom(value.data);
        return [];
      };

      async function allPages(path, params = {}) {
        let page = 1;
        const result = [];
        while (page <= 100) {
          const query = new URLSearchParams({ ...params, page: String(page), page_size: '100' });
          const data = await api(path + '?' + query);
          const items = arrayFrom(data);
          result.push(...items);
          const totalPages = Number(data?.total_pages || data?.pages || 0);
          if ((totalPages && page >= totalPages) || items.length < 100) break;
          page += 1;
        }
        return result;
      }

      function proxyId(proxy) {
        return proxy.id ?? proxy.proxy_id;
      }

      function proxyName(proxy) {
        return proxy.name || proxy.host || ('代理 #' + proxyId(proxy));
      }

      function accountEmail(account) {
        return String(account.email || account.account_email || account.user_email || account.account?.email || account.user?.email || account.credentials?.email || '').trim();
      }

      function accountName(account) {
        return account.name || accountEmail(account) || account.account || ('账号 #' + account.id);
      }

      function groupId(group) {
        return group?.id ?? group?.group_id;
      }

      function groupName(group) {
        return group?.name || group?.title || group?.label || ('分组 #' + groupId(group));
      }

      function normalizedGroupName(value) {
        return String(value || '').trim().toLowerCase();
      }

      function compactGroupName(value) {
        return String(value || '').trim().toLowerCase().replace(/\s+/g, '');
      }

      function valueAsID(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : value;
      }

      function accountGroupIDs(account) {
        const source = Array.isArray(account.group_ids)
          ? account.group_ids
          : (Array.isArray(account.groups) ? account.groups : []);
        return source.map((item) => typeof item === 'object' ? groupId(item) : item)
          .filter((id) => id != null)
          .map((id) => String(id));
      }

      function accountGroups(account) {
        return accountGroupIDs(account).map((id) => {
          const group = state.groups.find((item) => String(groupId(item)) === id);
          return group || { id, name: '分组 #' + id };
        });
      }

      function accountGroupsMarkup(account) {
        const groups = accountGroups(account);
        if (!groups.length) {
          return '<div class="account-groups"><span class="account-groups-empty">未分组</span></div>';
        }

        const labels = groups.map((group) => groupName(group));
        return '<div class="account-groups" title="' + escapeHTML(labels.join('、')) + '">' +
          labels.map((label) => '<span class="account-group" title="' + escapeHTML(label) + '">' + escapeHTML(label) + '</span>').join('') +
          '</div>';
      }

      function statusKey(value) {
        return String(value || 'unknown').toLowerCase().replace(/[^a-z0-9_]+/g, '_');
      }

      function isFuture(value) {
        if (!value) return false;
        const timestamp = new Date(value).getTime();
        return Number.isFinite(timestamp) && timestamp > Date.now();
      }

      function activeModelRateLimit(account) {
        const modelLimits = account.extra?.model_rate_limits;
        if (!modelLimits || typeof modelLimits !== 'object') return false;
        return Object.values(modelLimits).some((item) => isFuture(item?.rate_limit_reset_at));
      }

      function accountStatus(account) {
        let key = statusKey(account.status);
        let detail = '';

        if (isFuture(account.rate_limit_reset_at) || activeModelRateLimit(account)) {
          key = 'rate_limited';
          detail = account.rate_limit_reset_at ? '预计 ' + formatDate(account.rate_limit_reset_at) + ' 恢复' : '模型限流中';
        } else if (isFuture(account.overload_until)) {
          key = 'overloaded';
          detail = '预计 ' + formatDate(account.overload_until) + ' 恢复';
        } else if (isFuture(account.temp_unschedulable_until)) {
          key = 'temp_unschedulable';
          detail = '预计 ' + formatDate(account.temp_unschedulable_until) + ' 恢复';
        }

        if (!statusLabels[key]) {
          key = 'unknown';
          detail = account.status ? '原始状态：' + account.status : '';
        }

        if (key === 'error' && account.error_message) detail = account.error_message;
        return { key, label: statusLabels[key], detail };
      }

      function quickAccountStatus(accountState) {
        if (accountState.key === 'active' || accountState.key === 'normal') {
          return { key: 'normal', label: '正常' };
        }
        if (['rate_limited', 'overloaded', 'temp_unschedulable'].includes(accountState.key)) {
          return { key: 'limited', label: '限流' };
        }
        return { key: 'error', label: '错误' };
      }

      function formatDate(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return '';
        return date.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function formatLatency(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.round(number) + ' ms' : '未测试';
      }

      function latencyClass(value) {
        if (value == null) return '';
        return value < 300 ? 'good' : value < 800 ? 'warn' : 'bad';
      }

      function averageLatency(samples) {
        const valid = samples.filter((sample) => Number.isFinite(sample));
        return valid.length ? valid.reduce((sum, sample) => sum + sample, 0) / valid.length : null;
      }

      function latencyView(info) {
        const samples = Array.isArray(info?.samples) ? info.samples : [];
        const recent = samples.length ? samples.map((sample) => sample === null ? '失败' : formatLatency(sample)).join(' / ') : '未测试';
        const main = info?.testing ? '测试中…' : '平均 ' + formatLatency(info?.average);
        const detail = '近三次：' + recent + (info?.testing ? ' · ' + samples.length + '/3' : '');
        return { main, detail };
      }

      const firstTokenBucketDuration = 15 * 60 * 1000;
      const firstTokenBucketCount = 96;
      const firstTokenChartSeries = [
        { key: 'average', label: '平均值', color: '#5865d9' },
        { key: 'p95', label: 'P95', color: '#c77b15' },
        { key: 'p99', label: 'P99', color: '#d34f5f' }
      ];

      function timestampMs(value) {
        if (value == null || value === '') return null;
        const numeric = Number(value);
        if (Number.isFinite(numeric)) return Math.abs(numeric) < 100000000000 ? numeric * 1000 : numeric;
        const timestamp = new Date(value).getTime();
        return Number.isFinite(timestamp) ? timestamp : null;
      }

      function requestAccountID(request) {
        return request?.account_id ?? request?.accountId ?? request?.account?.id;
      }

      function requestProxyID(request) {
        return request?.proxy_id ?? request?.proxyId ?? request?.proxy?.id ?? request?.account?.proxy_id ?? request?.account?.proxyId ?? request?.account?.proxy?.id;
      }

      function requestCreatedAt(request) {
        return request?.created_at ?? request?.createdAt ?? request?.started_at ?? request?.startedAt ?? request?.timestamp;
      }

      function requestFirstTokenMs(request) {
        const value = Number(request?.first_token_ms ?? request?.firstTokenMs ?? request?.time_to_first_token_ms ?? request?.timeToFirstTokenMs ?? request?.ttft_ms ?? request?.ttftMs);
        return Number.isFinite(value) && value >= 0 ? value : null;
      }

      function percentile(values, ratio) {
        if (!values.length) return null;
        const sorted = [...values].sort((left, right) => left - right);
        const position = (sorted.length - 1) * ratio;
        const lower = Math.floor(position);
        const upper = Math.ceil(position);
        if (lower === upper) return sorted[lower];
        return sorted[lower] + (sorted[upper] - sorted[lower]) * (position - lower);
      }

      function firstTokenStats(values) {
        if (!values.length) return { count: 0, average: null, p95: null, p99: null };
        return {
          count: values.length,
          average: values.reduce((sum, value) => sum + value, 0) / values.length,
          p95: percentile(values, .95),
          p99: percentile(values, .99)
        };
      }

      function aggregateFirstTokenMetrics(requests) {
        const oauthAccountIDs = new Set(state.accounts
          .map((account) => account.id)
          .filter((id) => id != null)
          .map((id) => String(id)));
        const accountProxyIDs = new Map(state.accounts
          .filter((account) => account.id != null && account.proxy_id != null)
          .map((account) => [String(account.id), String(account.proxy_id)]));
        const knownProxyIDs = new Set(state.proxies
          .map((proxy) => proxyId(proxy))
          .filter((id) => id != null)
          .map((id) => String(id)));
        const rangeEnd = Date.now();
        const currentBucketStart = Math.floor(rangeEnd / firstTokenBucketDuration) * firstTokenBucketDuration;
        const rangeStart = currentBucketStart - firstTokenBucketDuration * (firstTokenBucketCount - 1);
        const samples = new Map([...knownProxyIDs].map((id) => [id, Array.from({ length: firstTokenBucketCount }, () => [])]));

        requests.forEach((request) => {
          const firstToken = requestFirstTokenMs(request);
          const createdAt = timestampMs(requestCreatedAt(request));
          if (firstToken == null || createdAt == null) return;
          if (createdAt < rangeStart || createdAt > rangeEnd) return;

          const directProxyID = requestProxyID(request);
          const accountID = requestAccountID(request);
          if (accountID == null || !oauthAccountIDs.has(String(accountID))) return;
          const proxyID = directProxyID != null ? String(directProxyID) : accountProxyIDs.get(String(accountID));
          const proxySamples = samples.get(proxyID);
          if (!proxySamples) return;

          const bucketIndex = Math.min(
            firstTokenBucketCount - 1,
            Math.floor((createdAt - rangeStart) / firstTokenBucketDuration)
          );
          if (bucketIndex >= 0) proxySamples[bucketIndex].push(firstToken);
        });

        return Object.fromEntries([...samples].map(([proxyID, buckets]) => [
          proxyID,
          buckets.map((values, index) => ({
            start: rangeStart + index * firstTokenBucketDuration,
            ...firstTokenStats(values)
          }))
        ]));
      }

      function formatFirstTokenMs(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return '—';
        const seconds = number / 1000;
        const precision = seconds >= 10 ? 1 : 2;
        return seconds.toFixed(precision).replace(/\.?0+$/, '') + 's';
      }

      function formatFirstTokenHour(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return '';
        return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function svgNumber(value) {
        return Number(value.toFixed(2));
      }

      function firstTokenMetricValue(bucket, key) {
        const raw = bucket?.[key];
        if (raw == null || raw === '') return null;
        const value = Number(raw);
        return Number.isFinite(value) && value >= 0 ? value : null;
      }

      // 高斯低通平滑核：radius 越大越平滑（也越抹平真实波峰）。
      // radius=6 → 13 点窗口，15 分钟桶下有效跨度约 ±90 分钟，足以压掉逐桶抖动。
      // 想更顺就调大 radius，想更保真就调小。
      const firstTokenSmoothingRadius = 6;

      const firstTokenSmoothingWeights = (() => {
        const sigma = Math.max(firstTokenSmoothingRadius / 2, .5);
        return Array.from({ length: firstTokenSmoothingRadius * 2 + 1 }, (_, index) => {
          const distance = index - firstTokenSmoothingRadius;
          return Math.exp(-(distance * distance) / (2 * sigma * sigma));
        });
      })();

      function firstTokenSmoothedValues(buckets, key) {
        const radius = Math.floor(firstTokenSmoothingWeights.length / 2);
        return buckets.map((bucket, index) => {
          if (firstTokenMetricValue(bucket, key) == null) return null;
          let weightedTotal = 0;
          let weightTotal = 0;
          for (let offset = -radius; offset <= radius; offset += 1) {
            const neighbor = buckets[index + offset];
            const value = firstTokenMetricValue(neighbor, key);
            if (value == null) continue;
            const weight = firstTokenSmoothingWeights[offset + radius];
            weightedTotal += value * weight;
            weightTotal += weight;
          }
          return weightTotal ? weightedTotal / weightTotal : null;
        });
      }

      // 圆角样条：切线用 Catmull-Rom（相邻点的中心差分斜率 dy/dx），峰顶做成圆弧不再尖。
      // 关键：控制点的 x 一律固定在每段的 1/3、2/3 处，只有 y 跟随切线，
      // 因此曲线永远沿时间向前，不会因缺口(空桶)导致的非均匀间距而“回头转折”。
      function firstTokenSmoothPath(points, bounds) {
        if (!points.length) return '';
        const pointText = (point) => svgNumber(point.x) + ' ' + svgNumber(point.y);
        if (points.length === 1) return 'M ' + pointText(points[0]);

        const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
        const tangents = points.map((point, index) => {
          const previous = points[index - 1];
          const next = points[index + 1];
          if (!previous) return next ? (next.y - point.y) / ((next.x - point.x) || 1) : 0;
          if (!next) return (point.y - previous.y) / ((point.x - previous.x) || 1);
          const span = next.x - previous.x;
          return span ? (next.y - previous.y) / span : 0;
        });
        const commands = ['M ' + pointText(points[0])];
        for (let index = 0; index < points.length - 1; index += 1) {
          const current = points[index];
          const next = points[index + 1];
          const distance = next.x - current.x;
          const firstControl = {
            x: current.x + distance / 3,
            y: clamp(current.y + tangents[index] * distance / 3, bounds.top, bounds.bottom)
          };
          const secondControl = {
            x: next.x - distance / 3,
            y: clamp(next.y - tangents[index + 1] * distance / 3, bounds.top, bounds.bottom)
          };
          commands.push('C ' + pointText(firstControl) + ', ' + pointText(secondControl) + ', ' + pointText(next));
        }
        return commands.join(' ');
      }

      // 全局统一的 Y 轴上限：取所有代理平滑后曲线的最大值，让每张图共用同一刻度，便于横向对比差异。
      function firstTokenSharedYMax() {
        let max = 0;
        const metrics = state.firstToken.metrics || {};
        Object.keys(metrics).forEach((proxyID) => {
          const buckets = Array.isArray(metrics[proxyID]) ? metrics[proxyID] : [];
          firstTokenChartSeries.forEach((series) => {
            firstTokenSmoothedValues(buckets, series.key).forEach((value) => {
              if (value != null && value > max) max = value;
            });
          });
        });
        return max > 0 ? max * 1.1 : 1000;
      }

      function firstTokenChartMarkup(proxyID) {
        const buckets = Array.isArray(state.firstToken.metrics[String(proxyID)]) ? state.firstToken.metrics[String(proxyID)] : [];
        const displaySeries = firstTokenChartSeries.map((series) => ({
          ...series,
          values: firstTokenSmoothedValues(buckets, series.key)
        }));
        const values = displaySeries.flatMap((series) => series.values
          .filter((value) => value != null));
        if (!values.length) return '<div class="proxy-summary-chart-empty">暂无 OAuth 首字样本</div>';

        const chartWidth = 360;
        const chartHeight = 200;
        const plot = { left: 34, right: 354, top: 14, bottom: 166 };
        const plotWidth = plot.right - plot.left;
        const plotHeight = plot.bottom - plot.top;
        const yMax = firstTokenSharedYMax();
        const xPosition = (index) => plot.left + (buckets.length > 1 ? index / (buckets.length - 1) : .5) * plotWidth;
        const yPosition = (value) => plot.bottom - (value / yMax) * plotHeight;
        const yTicks = Array.from({ length: 5 }, (_, index) => {
          const ratio = index / 4;
          const value = yMax * (1 - ratio);
          const y = plot.top + plotHeight * ratio;
          return '<line class="proxy-summary-chart-grid" x1="' + plot.left + '" y1="' + svgNumber(y) + '" x2="' + plot.right + '" y2="' + svgNumber(y) + '"></line>' +
            '<text class="proxy-summary-chart-label" x="' + (plot.left - 6) + '" y="' + svgNumber(y + 3) + '" text-anchor="end">' + escapeHTML(formatFirstTokenMs(value)) + '</text>';
        }).join('');
        const xTickIndexes = [...new Set(Array.from({ length: 7 }, (_, index) =>
          Math.round(index * (buckets.length - 1) / 6)
        ))].filter((index) => index >= 0 && index < buckets.length);
        const xTicks = xTickIndexes.map((index) => {
          const x = xPosition(index);
          return '<text class="proxy-summary-chart-label" x="' + svgNumber(x) + '" y="181" text-anchor="middle">' + escapeHTML(formatFirstTokenHour(buckets[index].start)) + '</text>';
        }).join('');
        const seriesMarkup = displaySeries.map((series) => {
          const points = series.values.map((value, index) => {
            if (value == null) return null;
            return { index, value, x: xPosition(index), y: yPosition(value) };
          }).filter(Boolean);
          const path = firstTokenSmoothPath(points, plot);
          const pathMarkup = path ? '<path class="proxy-summary-chart-path" d="' + path + '" stroke="' + series.color + '"></path>' : '';
          return pathMarkup;
        }).join('');
        const legend = firstTokenChartSeries.map((series) => '<span class="proxy-summary-chart-legend-item"><i class="proxy-summary-chart-swatch ' + series.key + '"></i>' + escapeHTML(series.label) + '</span>').join('');

        return '<div class="proxy-summary-chart-wrap">' +
          '<div class="proxy-summary-chart-legend" aria-label="图例">' + legend + '</div>' +
          '<svg class="proxy-summary-chart" viewBox="0 0 ' + chartWidth + ' ' + chartHeight + '" role="img" aria-label="最近 24 小时首字耗时趋势图，每 15 分钟聚合，包含平均值、P95 和 P99">' +
            yTicks +
            '<line class="proxy-summary-chart-axis" x1="' + plot.left + '" y1="' + plot.top + '" x2="' + plot.left + '" y2="' + plot.bottom + '"></line>' +
            '<line class="proxy-summary-chart-axis" x1="' + plot.left + '" y1="' + plot.bottom + '" x2="' + plot.right + '" y2="' + plot.bottom + '"></line>' +
            xTicks +
            '<text class="proxy-summary-chart-axis-title" transform="rotate(-90 10 90)" x="10" y="90" text-anchor="middle">首字耗时</text>' +
            '<text class="proxy-summary-chart-axis-title" x="194" y="198" text-anchor="middle">时间</text>' +
            seriesMarkup +
          '</svg>' +
        '</div>';
      }

      function firstTokenSummaryMarkup(proxyID) {
        const stateNote = state.firstToken.loading ? '加载中…' : (state.firstToken.error ? '加载失败' : '仅 OAuth · 15 分钟平滑趋势');
        const errorTitle = state.firstToken.error ? '首字统计不可用：' + state.firstToken.error : '';
        const chartMarkup = state.firstToken.loading
          ? '<div class="proxy-summary-chart-empty">正在加载首字数据…</div>'
          : state.firstToken.error
            ? '<div class="proxy-summary-chart-empty">首字统计不可用：' + escapeHTML(state.firstToken.error) + '</div>'
            : firstTokenChartMarkup(proxyID);
        return '<div class="proxy-summary-token"' + (errorTitle ? ' title="' + escapeHTML(errorTitle) + '"' : '') + '>' +
          '<div class="proxy-summary-token-head"><strong>近期请求首字</strong><small>' + escapeHTML(stateNote) + '</small></div>' +
          chartMarkup + '</div>';
      }

      async function loadFirstTokenMetrics() {
        state.firstToken = { metrics: {}, loading: true, error: '' };
        renderProxySummary();
        try {
          const requests = await allPages('/admin/ops/requests', { time_range: '24h', platform: 'openai', kind: 'all', sort: 'created_at_desc' });
          state.firstToken.metrics = aggregateFirstTokenMetrics(requests);
        } catch (error) {
          state.firstToken.error = error.message || '请求记录加载失败';
        } finally {
          state.firstToken.loading = false;
          renderProxySummary();
        }
      }

      async function testProxy(proxyID) {
        const key = String(proxyID);
        const samples = [];
        let lastError = '';
        state.latency[key] = { samples: [], average: null, testing: true, error: '' };
        render();

        for (let index = 0; index < 3; index += 1) {
          try {
            const data = await api('/admin/proxies/' + proxyID + '/test', { method: 'POST' });
            const value = Number(data?.latency_ms ?? data?.latency);
            if (Number.isFinite(value) && value >= 0) samples.push(value);
            else {
              samples.push(null);
              lastError = '接口未返回有效延迟';
            }
          } catch (error) {
            samples.push(null);
            lastError = error.message || '代理测试失败';
          }
          state.latency[key] = {
            samples: [...samples],
            average: averageLatency(samples),
            testing: index < 2,
            error: lastError
          };
          render();
        }
        return state.latency[key];
      }

      async function testAllProxies() {
        const proxies = state.proxies.filter((proxy) => proxyId(proxy) != null);
        if (!proxies.length) return;
        let finished = 0;
        setStatus('正在测试代理延迟（0/' + proxies.length + '）', false, true);
        await Promise.all(proxies.map(async (proxy) => {
          await testProxy(proxyId(proxy));
          finished += 1;
          setStatus('正在测试代理延迟（' + finished + '/' + proxies.length + '）', false, true);
        }));
      }

      function proxyStatus(proxy) {
        const raw = statusKey(proxy.status);
        return { raw, label: proxyStatusLabels[raw] || proxy.status || '未知状态' };
      }

      function usage(account) {
        const extra = account.extra || {};
        const percent = Number(extra.codex_7d_used_percent);
        if (!Number.isFinite(percent)) {
          return '<div class="usage usage-empty" title="暂无已保存用量数据"><span class="usage-ring" aria-hidden="true"><strong>—</strong></span><span class="usage-copy"><strong>7d 用量</strong><small>暂无快照</small></span></div>';
        }

        const value = clampUsagePercent(percent);
        const resetAt = extra.codex_7d_reset_at ? formatDate(extra.codex_7d_reset_at) : '';
        const updatedAt = extra.codex_usage_updated_at ? formatDate(extra.codex_usage_updated_at) : '';
        const note = resetAt ? '重置 ' + resetAt : (updatedAt ? '更新 ' + updatedAt : '已保存快照');
        const color = value >= 90 ? '#d34f5f' : (value >= 70 ? '#c77b15' : '#15966c');
        return '<div class="usage" title="' + escapeHTML((updatedAt ? '更新：' + updatedAt + '；' : '') + (resetAt ? '重置：' + resetAt : '')) + '">' +
          '<span class="usage-ring" style="--usage-percent:' + value + '%;--usage-color:' + color + '" aria-label="7d 已使用 ' + escapeHTML(formatUsagePercent(value)) + '"><strong>' + formatUsagePercent(value) + '</strong></span>' +
          '<span class="usage-copy"><strong>7d 已使用</strong><small>' + escapeHTML(note) + '</small></span></div>';
      }

      function clampUsagePercent(value) {
        if (value == null) return null;
        const number = Number(value);
        return Number.isFinite(number) ? Math.max(0, Math.min(100, number)) : null;
      }

      function formatUsagePercent(value) {
        const number = clampUsagePercent(value);
        return number == null ? '—' : Math.round(number) + '%';
      }

      function accountUsagePercent(account) {
        const value = Number(account.extra?.codex_7d_used_percent);
        return Number.isFinite(value) ? value : null;
      }

      function sortedAccounts(accounts) {
        return [...accounts].sort((left, right) => {
          const scheduleOrder = Number(Boolean(right.schedulable)) - Number(Boolean(left.schedulable));
          if (scheduleOrder) return scheduleOrder;

          const leftUsage = accountUsagePercent(left);
          const rightUsage = accountUsagePercent(right);
          if (leftUsage == null && rightUsage != null) return 1;
          if (leftUsage != null && rightUsage == null) return -1;
          if (leftUsage != null && rightUsage != null && leftUsage !== rightUsage) return leftUsage - rightUsage;

          return accountName(left).localeCompare(accountName(right), 'zh-CN') || Number(left.id) - Number(right.id);
        });
      }

      function updateQuickGroupSummary() {
        const element = $('#quickSelected');
        if (!element) return;
        element.textContent = state.quickGroupIDs.size ? '已选 ' + state.quickGroupIDs.size + ' 个分组' : '未选择分组';
      }

      function initializeQuickGroups() {
        const validIDs = new Set(state.groups
          .map((group) => groupId(group))
          .filter((id) => id != null)
          .map((id) => String(id)));

        if (!state.quickGroupsInitialized) {
          state.quickGroupIDs = new Set(state.groups
            .filter((group) => normalizedGroupName(groupName(group)) === 'openai 聚合')
            .map((group) => groupId(group))
            .filter((id) => id != null)
            .map((id) => String(id)));
          state.quickGroupsInitialized = true;
          return;
        }

        state.quickGroupIDs = new Set([...state.quickGroupIDs].filter((id) => validIDs.has(id)));
      }

      function renderQuickGroups() {
        const container = $('#quickGroups');
        if (!container) return;

        const groups = state.groups.filter((group) => groupId(group) != null);
        container.innerHTML = groups.length ? groups.map((group) => {
          const id = String(groupId(group));
          const label = groupName(group);
          return '<label class="quick-group-option" title="' + escapeHTML(label) + '">' +
            '<input type="checkbox" data-quick-group="' + escapeHTML(id) + '"' + (state.quickGroupIDs.has(id) ? ' checked' : '') + ' aria-label="选择分组 ' + escapeHTML(label) + '">' +
            '<span>' + escapeHTML(label) + '</span></label>';
        }).join('') : '<span class="quick-note">暂无可用分组</span>';

        updateQuickGroupSummary();
      }

      function quickAccountMatches(account) {
        return state.quickGroupIDs.size > 0 && accountGroupIDs(account).some((id) => state.quickGroupIDs.has(id));
      }

      function quickUsageLabel(account) {
        const percent = accountUsagePercent(account);
        return formatUsagePercent(percent);
      }

      function quickAccountTitle(account) {
        const accountState = accountStatus(account);
        const quickStatus = quickAccountStatus(accountState);
        const detail = accountState.detail ? '；' + accountState.detail : '';
        return (account.schedulable ? '调度中' : '已暂停') + ' · ' + accountName(account) + '（#' + account.id + '） · 状态 ' + quickStatus.label + ' · 7d 用量 ' + quickUsageLabel(account) + detail;
      }

      function accountTileTitle(account) {
        const name = String(account.name || '').trim() || ('账号 #' + account.id);
        const groups = accountGroups(account).map((group) => groupName(group)).join('、') || '未分组';
        const accountState = accountStatus(account);
        const detail = accountState.detail ? '；' + accountState.detail : '';
        return name + '（#' + account.id + '） · 分组 ' + groups + ' · 状态 ' + accountState.label + detail + ' · ' + (account.schedulable ? '调度中' : '已暂停') + ' · 7d 用量 ' + quickUsageLabel(account);
      }

      function renderQuickCards() {
        const container = $('#quickCards');
        if (!container) return;

        const proxies = state.proxies.filter((proxy) => proxyId(proxy) != null);
        if (!proxies.length) {
          container.innerHTML = '<div class="empty"><strong>暂无代理</strong>没有可展示的 IP 代理</div>';
          return;
        }

        const accountsByProxy = new Map(proxies.map((proxy) => [String(proxyId(proxy)), []]));
        state.accounts.filter(quickAccountMatches).forEach((account) => {
          if (account.proxy_id == null) return;
          const accounts = accountsByProxy.get(String(account.proxy_id));
          if (accounts) accounts.push(account);
        });

        const emptyText = state.quickGroupIDs.size ? '当前分组暂无匹配账号' : '请选择至少一个分组';
        container.innerHTML = proxies.map((proxy) => {
          const id = proxyId(proxy);
          const accounts = sortedAccounts(accountsByProxy.get(String(id)) || []);
          const squares = accounts.length ? accounts.map((account) => {
            const accountID = String(account.id);
            const updating = state.scheduleUpdating.has(accountID);
            const accountState = accountStatus(account);
            const quickStatus = quickAccountStatus(accountState);
            const usageLabel = quickUsageLabel(account);
            return '<button class="quick-account ' + (account.schedulable ? 'on' : 'off') + '" type="button" data-quick-schedule="' + escapeHTML(accountID) + '" title="' + escapeHTML(quickAccountTitle(account)) + '" aria-label="' + escapeHTML(quickAccountTitle(account)) + '"' + (updating ? ' disabled aria-busy="true"' : '') + '><span class="quick-account-status ' + escapeHTML(quickStatus.key) + '" title="' + escapeHTML(accountState.detail || quickStatus.label) + '"><i aria-hidden="true"></i><span>' + escapeHTML(quickStatus.label) + '</span></span><span class="quick-account-percent">' + escapeHTML(usageLabel) + '</span></button>';
          }).join('') : '<div class="quick-card-empty">' + escapeHTML(emptyText) + '</div>';

          return '<article class="quick-card">' +
            '<div class="quick-card-head"><div><div class="quick-card-title" title="' + escapeHTML(proxyName(proxy)) + '">' + escapeHTML(proxyName(proxy)) + '</div><div class="quick-card-meta">ID ' + escapeHTML(id) + ' · ' + accounts.length + ' 个账号</div></div></div>' +
            '<div class="quick-account-grid">' + squares + '</div></article>';
        }).join('');
      }

      function activeProxies() {
        return state.proxies.filter((proxy) => proxyId(proxy) != null && proxyStatus(proxy).raw === 'active');
      }

      function proxyAccountCount(proxyID) {
        const key = String(proxyID);
        return state.accounts.filter((account) => account.proxy_id != null && String(account.proxy_id) === key).length;
      }

      function compareProxyIDs(left, right) {
        const leftNumber = Number(proxyId(left));
        const rightNumber = Number(proxyId(right));
        if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber) && leftNumber !== rightNumber) return leftNumber - rightNumber;
        return String(proxyId(left)).localeCompare(String(proxyId(right)), 'en', { numeric: true });
      }

      function leastLoadedProxy(proxies) {
        return [...proxies].sort((left, right) => {
          const countOrder = proxyAccountCount(proxyId(left)) - proxyAccountCount(proxyId(right));
          return countOrder || compareProxyIDs(left, right);
        })[0] || null;
      }

      function quickAddDefaultGroups() {
        const wanted = new Map([['openai聚合', 'openai聚合'], ['号池', '号池']]);
        const groupIDs = new Set();
        const found = new Set();

        state.groups.forEach((group) => {
          const id = groupId(group);
          const key = compactGroupName(groupName(group));
          if (id != null && wanted.has(key)) {
            groupIDs.add(String(id));
            found.add(key);
          }
        });

        return {
          groupIDs,
          missing: [...wanted.values()].filter((name) => !found.has(name))
        };
      }

      function setQuickAddStatus(message, isError = false, isLoading = false) {
        const element = $('#quickAddStatus');
        if (!element) return;
        element.textContent = message || '';
        element.hidden = !message;
        element.className = 'modal-status' + (isError ? ' error' : '') + (isLoading ? ' loading' : '');
      }

      function updateQuickAddButton() {
        const button = $('#quickAddButton');
        if (!button) return;
        button.disabled = !state.loaded || state.loading || !readAuthToken();
      }

      function renderQuickAddProxyOptions() {
        const select = $('#quickAddProxy');
        if (!select) return;

        const proxies = activeProxies();
        if (!proxies.length) {
          select.innerHTML = '<option value="">暂无可用代理</option>';
          select.value = '';
          return;
        }

        select.innerHTML = proxies.map((proxy) => {
          const id = proxyId(proxy);
          const count = proxyAccountCount(id);
          return '<option value="' + escapeHTML(id) + '">' + escapeHTML(proxyName(proxy)) + '（当前 ' + count + ' 个账号）</option>';
        }).join('');
        select.value = state.quickAdd.proxyId || String(proxyId(leastLoadedProxy(proxies)));
        if (!proxies.some((proxy) => String(proxyId(proxy)) === String(select.value))) select.value = String(proxyId(proxies[0]));
        state.quickAdd.proxyId = select.value;

          link.classList.remove('empty');

      function updateQuickAddModalControls() {
        const generating = state.quickAdd.generating;
        const submitting = state.quickAdd.submitting;
        const proxy = $('#quickAddProxy');
        const model = $('#quickAddModel');
        const concurrency = $('#quickAddConcurrency');
        const priority = $('#quickAddPriority');
        const fingerprintMode = $('#quickAddFingerprintMode');
        const groups = $('#quickAddGroups');
        const callback = $('#quickAddCallback');
        const refresh = $('#quickAddRefresh');
        const submit = $('#quickAddSubmit');
        if (proxy) proxy.disabled = generating || submitting;
        if (model) model.disabled = submitting;
        if (concurrency) concurrency.disabled = submitting;
        if (priority) priority.disabled = submitting;
        if (fingerprintMode) fingerprintMode.disabled = submitting;
        if (groups) groups.style.pointerEvents = submitting ? 'none' : '';
        if (callback) callback.disabled = submitting;
        if (refresh) refresh.disabled = generating || submitting || !state.quickAdd.proxyId;
        if (submit) submit.disabled = generating || submitting || !state.quickAdd.sessionId || !state.quickAdd.authUrl;
        renderQuickAddAuthLink();
