<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>OAuth 管理 · Sub2API</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #e6eaf0;
      --line-strong: #d7dee9;
      --text: #172033;
      --muted: #697386;
      --subtle: #98a2b3;
      --primary: #5865d9;
      --primary-dark: #4652c5;
      --primary-soft: #eef0ff;
      --success: #15966c;
      --success-soft: #e8f8f1;
      --warning: #c77b15;
      --warning-soft: #fff5df;
      --danger: #d34f5f;
      --danger-soft: #fff0f1;
      --gray-soft: #f0f2f5;
      --shadow: 0 8px 28px rgba(38, 52, 77, .06);
      --shadow-hover: 0 12px 32px rgba(38, 52, 77, .1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 94% -12%, rgba(113, 128, 255, .12), transparent 32%),
        radial-gradient(circle at -8% 18%, rgba(97, 211, 183, .08), transparent 27%),
        var(--page);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .wrap { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 64px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .brand { display: flex; align-items: flex-start; gap: 14px; }
    .brand-icon {
      display: grid; width: 44px; height: 44px; flex: 0 0 44px; place-items: center; color: #fff;
      background: linear-gradient(145deg, #6977ec, #4d5ad0); border-radius: 14px;
      box-shadow: 0 8px 18px rgba(88, 101, 217, .24);
    }
    .brand-icon svg { width: 23px; height: 23px; }
    .eyebrow { margin: 1px 0 5px; color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .title { margin: 0; color: var(--text); font-size: clamp(25px, 3vw, 32px); font-weight: 760; letter-spacing: -.035em; line-height: 1.15; }
    .sub { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .connection {
      display: flex; align-items: center; gap: 11px; min-width: 190px; padding: 12px 15px;
      background: rgba(255, 255, 255, .8); border: 1px solid rgba(215, 222, 233, .9); border-radius: 14px;
      box-shadow: 0 5px 18px rgba(38, 52, 77, .04);
    }
    .connection-dot { width: 9px; height: 9px; flex: 0 0 9px; background: var(--success); border-radius: 50%; box-shadow: 0 0 0 4px var(--success-soft); }
    .connection-dot.pending { background: var(--warning); box-shadow: 0 0 0 4px var(--warning-soft); }
    .connection strong, .connection small { display: block; }
    .connection strong { font-size: 13px; }
    .connection small { margin-top: 1px; color: var(--muted); font-size: 11px; }

    .panel { background: rgba(255, 255, 255, .94); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .metric {
      display: flex; align-items: center; gap: 12px; min-height: 92px; padding: 17px 18px;
      background: rgba(255, 255, 255, .86); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 5px 20px rgba(38, 52, 77, .035);
    }
    .metric-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; }
    .metric-icon svg { width: 19px; height: 19px; }
    .metric:nth-child(1) .metric-icon { color: #5965d8; background: var(--primary-soft); }
    .metric:nth-child(2) .metric-icon { color: #7d57c8; background: #f1ebff; }
    .metric:nth-child(3) .metric-icon { color: var(--success); background: var(--success-soft); }
    .metric:nth-child(4) .metric-icon { color: var(--warning); background: var(--warning-soft); }
    .metric-label, .metric-note { display: block; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric-value { display: block; margin-top: 1px; color: var(--text); font-size: 23px; font-weight: 760; line-height: 1.15; }
    .metric-note { margin-top: 2px; color: var(--subtle); font-size: 11px; }
    .metric-action { flex: 0 0 auto; margin-left: auto; padding: 7px 9px; color: var(--primary-dark); background: var(--primary-soft); border-color: #c9cdf8; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .metric-action:hover:not(:disabled) { color: #fff; background: var(--primary); border-color: var(--primary); }

    .assign { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 74px; margin-bottom: 22px; padding: 14px 18px; }
    .assign-copy, .assign-controls { display: flex; align-items: center; gap: 11px; }
    .assign-copy { min-width: 0; }
    .assign-copy strong { white-space: nowrap; }
    .section-kicker { color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: .08em; white-space: nowrap; }
    .selected { padding-left: 11px; color: var(--muted); font-size: 12px; border-left: 1px solid var(--line-strong); white-space: nowrap; }
    select {
      min-width: 180px; padding: 9px 34px 9px 12px; color: var(--text); background-color: #fff;
      background-image: linear-gradient(45deg, transparent 50%, #8b95a7 50%), linear-gradient(135deg, #8b95a7 50%, transparent 50%);
      background-position: calc(100% - 16px) 14px, calc(100% - 11px) 14px; background-repeat: no-repeat; background-size: 5px 5px, 5px 5px;
      border: 1px solid var(--line-strong); border-radius: 10px; appearance: none;
    }
    select:focus { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    button { padding: 9px 14px; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; transition: .18s ease; }
    button:hover:not(:disabled) { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    button.primary { color: #fff; background: linear-gradient(135deg, #6875e8, #5360d3); border-color: transparent; box-shadow: 0 5px 13px rgba(88, 101, 217, .2); font-weight: 650; }
    button.primary:hover:not(:disabled) { color: #fff; background: linear-gradient(135deg, #5e6bdd, #4b57c6); box-shadow: 0 7px 17px rgba(88, 101, 217, .27); }
    .status { min-width: 0; color: var(--muted); font-size: 12px; text-align: right; }
    .status.error { color: var(--danger); }
    .status.loading { color: var(--primary); }

    .quick-dispatch { margin-bottom: 22px; padding: 18px 20px 20px; }
    .quick-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .quick-title { margin: 3px 0 0; font-size: 17px; font-weight: 720; }
    .quick-description { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .quick-selected { flex: 0 0 auto; padding: 6px 9px; color: var(--muted); background: var(--surface-soft); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; white-space: nowrap; }
    .quick-filter-row { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .quick-filter-label { flex: 0 0 auto; padding-top: 6px; color: var(--subtle); font-size: 12px; font-weight: 650; }
    .quick-groups { display: flex; flex: 1; flex-wrap: wrap; gap: 7px; min-width: 0; }
    .quick-group-option { position: relative; display: inline-flex; max-width: 100%; }
    .quick-group-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .quick-group-option span { display: inline-flex; max-width: 100%; padding: 6px 10px; overflow: hidden; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 12px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; transition: .18s ease; }
    .quick-group-option span:hover { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    .quick-group-option input:checked + span { color: var(--primary-dark); background: var(--primary-soft); border-color: #b8bef4; font-weight: 650; }
    .quick-group-option input:focus-visible + span { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .quick-note { padding: 6px 0; color: var(--subtle); font-size: 12px; }
    .quick-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 14px; padding-top: 12px; }
    .quick-card { min-width: 0; padding: 11px; background: linear-gradient(180deg, #fff, #fcfdff); border: 1px solid var(--line); border-radius: 11px; }
    .quick-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; margin-bottom: 10px; }
    .quick-card-head > div:first-child { min-width: 0; }
    .quick-card-title { min-width: 0; overflow: hidden; color: var(--text); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .quick-card-meta { margin-top: 2px; color: var(--subtle); font-size: 10px; }
    .quick-card-status { flex: 0 0 auto; min-height: 20px; padding: 2px 6px; font-size: 10px; }
    .quick-card-status.good { color: var(--success); background: var(--success-soft); }
    .quick-card-status.warn { color: var(--warning); background: var(--warning-soft); }
    .quick-card-status.bad { color: var(--danger); background: var(--danger-soft); }
    .quick-account-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .quick-account { position: relative; display: grid; width: 100%; aspect-ratio: 1; place-items: center; min-width: 0; padding: 2px; overflow: hidden; color: #667085; background: var(--gray-soft); border: 1px solid #e0e4ea; border-radius: 7px; box-shadow: none; transition: .18s ease; }
    .quick-account:hover:not(:disabled) { color: #59656f; background: #e8ebef; border-color: #cbd2dd; transform: translateY(-1px); }
    .quick-account.on { color: var(--success); background: var(--success-soft); border-color: #bcebd8; }
    .quick-account.on:hover:not(:disabled) { color: #107a57; background: #dcf5e9; border-color: #91dbbd; }
    .quick-account-status { position: absolute; top: 3px; right: 3px; z-index: 1; display: inline-flex; align-items: center; gap: 2px; max-width: calc(100% - 6px); font-size: 8px; font-weight: 760; line-height: 1; white-space: nowrap; }
    .quick-account-status i { width: 4px; height: 4px; flex: 0 0 4px; border-radius: 50%; background: currentColor; }
    .quick-account-status.normal { color: var(--success); }
    .quick-account-status.limited { color: var(--warning); }
    .quick-account-status.error { color: var(--danger); }
    .quick-account-percent { min-width: 0; max-width: 100%; padding: 0 1px; font-size: 10px; font-weight: 760; line-height: 1.1; white-space: nowrap; }
    .quick-card-empty { grid-column: 1 / -1; padding: 12px 4px 10px; color: var(--subtle); font-size: 11px; }

    #list { display: grid; gap: 18px; }
    #list.loading { opacity: .72; pointer-events: none; }
    .proxy { overflow: hidden; transition: box-shadow .2s ease, transform .2s ease; }
    .proxy:hover { box-shadow: var(--shadow-hover); }
    .proxy-head { display: grid; grid-template-columns: minmax(220px, 1fr) auto auto auto; align-items: center; gap: 18px; padding: 18px 20px; background: linear-gradient(180deg, #fff, #fcfdff); border-bottom: 1px solid var(--line); }
    .proxy-head.unbound { grid-template-columns: minmax(220px, 1fr) auto; }
    .proxy-head.unbound .proxy-count { grid-column: 2; grid-row: 1; }
    .proxy-heading { min-width: 0; }
    .proxy-name-line { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .proxy-dot { width: 9px; height: 9px; flex: 0 0 9px; background: var(--success); border-radius: 50%; }
    .proxy-dot.inactive, .proxy-dot.expired { background: var(--subtle); }
    .proxy-dot.error { background: var(--danger); }
    .proxy-name { overflow: hidden; font-size: 16px; font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 12px; }
    .proxy-meta { margin-top: 3px; padding-left: 18px; }
    .proxy-status, .badge { display: inline-flex; align-items: center; justify-content: center; min-height: 25px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .proxy-status.active, .badge.active, .badge.normal { color: var(--success); background: var(--success-soft); }
    .proxy-status.inactive, .proxy-status.expired, .badge.inactive, .badge.expired, .badge.paused, .badge.unknown { color: #667085; background: var(--gray-soft); }
    .proxy-status.error, .badge.error { color: var(--danger); background: var(--danger-soft); }
    .badge.rate-limited, .badge.overloaded, .badge.temp-unschedulable { color: var(--warning); background: var(--warning-soft); }
    .proxy-latency { min-width: 112px; color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .proxy-latency strong, .proxy-latency small { display: block; }
    .proxy-latency strong { font-size: 12px; font-weight: 700; }
    .proxy-latency small { overflow: hidden; margin-top: 2px; color: var(--subtle); font-size: 10px; font-weight: 500; text-overflow: ellipsis; }
    .proxy-latency.good { color: var(--success); }
    .proxy-latency.warn { color: var(--warning); }
    .proxy-latency.bad { color: var(--danger); }
    .proxy-count { min-width: 72px; text-align: center; }
    .count { display: block; font-size: 19px; font-weight: 760; line-height: 1.1; }
    .proxy-action { min-width: 82px; }

    .accounts { padding: 0 20px 6px; }
    .account-head, .account { display: grid; grid-template-columns: 30px minmax(180px, 1.25fr) minmax(145px, .9fr) minmax(110px, .7fr) minmax(140px, .85fr) minmax(230px, 1.4fr); align-items: center; gap: 13px; }
    .account-head { min-height: 42px; color: var(--subtle); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .account { min-height: 73px; border-top: 1px solid #edf0f4; }
    .account:hover { background: linear-gradient(90deg, transparent, #fbfcff 8%, #fbfcff 92%, transparent); }
    .account-check { width: 16px; height: 16px; margin: 0 auto; accent-color: var(--primary); }
    .account-main { min-width: 0; }
    .account-name { overflow: hidden; color: var(--text); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .account-id { margin-left: 5px; color: var(--subtle); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; }
    .account-detail { overflow: hidden; margin-top: 2px; color: var(--subtle); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .group-cell { min-width: 0; }
    .account-groups { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; max-height: 42px; overflow: hidden; }
    .account-group { display: inline-flex; max-width: 100%; padding: 3px 7px; overflow: hidden; color: #5d4ca1; background: #f2efff; border: 1px solid #e5e0ff; border-radius: 6px; font-size: 11px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .account-groups-empty { color: var(--subtle); font-size: 11px; }
    .status-cell, .schedule-cell { min-width: 0; }
    .status-cell small { display: block; overflow: hidden; margin-top: 3px; color: var(--subtle); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .schedule-button { display: inline-flex; align-items: center; gap: 8px; padding: 0; color: var(--muted); background: transparent; border: 0; box-shadow: none; }
    .schedule-button:hover:not(:disabled) { color: var(--primary-dark); background: transparent; border-color: transparent; }
    .switch { display: inline-flex; width: 37px; height: 21px; padding: 3px; align-items: center; background: #cbd2dd; border: 0; border-radius: 20px; transition: .18s ease; }
    .switch i { display: block; width: 15px; height: 15px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(24, 32, 48, .22); transition: .18s ease; }
    .switch.on { background: #54c19b; }
    .switch.on i { transform: translateX(16px); }
    .schedule-label { font-size: 12px; white-space: nowrap; }
    .schedule-label.on { color: var(--success); font-weight: 650; }
    .usage { min-width: 0; }
    .usage-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .usage-top strong { color: var(--text); font-size: 12px; font-weight: 700; }
    .usage-bar { height: 6px; margin-top: 6px; overflow: hidden; background: #edf0f5; border-radius: 999px; }
    .usage-bar b { display: block; height: 100%; background: linear-gradient(90deg, #63cda5, #4eae90); border-radius: inherit; }
    .usage-note { display: block; overflow: hidden; margin-top: 4px; color: var(--subtle); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .empty, .loading-state { padding: 42px 24px; color: var(--muted); text-align: center; }
    .loading-state { border: 1px dashed var(--line-strong); border-radius: 16px; }
    .empty strong, .loading-state strong { display: block; margin-bottom: 4px; color: var(--text); }

    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; padding: 20px; overflow-y: auto; place-items: center; background: rgba(24, 32, 48, .42); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(700px, 100%); margin: auto; overflow: hidden; background: var(--surface); border: 1px solid rgba(215, 222, 233, .95); border-radius: 18px; box-shadow: 0 24px 70px rgba(20, 28, 48, .24); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
    .modal-title { margin: 0; font-size: 19px; font-weight: 750; }
    .modal-description { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .modal-close { width: 32px; height: 32px; padding: 0; color: var(--muted); border-radius: 9px; font-size: 21px; line-height: 1; }
    .modal-body { display: grid; gap: 17px; padding: 20px 22px; }
    .quick-add-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 13px; }
    .form-field { display: grid; gap: 6px; min-width: 0; }
    .form-label { color: var(--text); font-size: 12px; font-weight: 700; }
    .form-hint { color: var(--subtle); font-size: 11px; }
    .form-field select { width: 100%; min-width: 0; }
    .form-field input, .form-field textarea { width: 100%; padding: 9px 11px; color: var(--text); background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; }
    .form-field input:focus, .form-field textarea:focus { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .form-field input[readonly] { color: var(--muted); background: var(--surface-soft); }
    .form-field textarea { min-height: 84px; resize: vertical; }
    .quick-add-groups { display: flex; flex-wrap: wrap; gap: 7px; min-height: 32px; }
    .quick-add-group-option { position: relative; display: inline-flex; max-width: 100%; }
    .quick-add-group-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .quick-add-group-option span { display: inline-flex; max-width: 100%; padding: 6px 10px; overflow: hidden; color: var(--muted); background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 12px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; transition: .18s ease; }
    .quick-add-group-option span:hover { color: var(--primary-dark); border-color: #aeb6ed; background: #fafaff; }
    .quick-add-group-option input:checked + span { color: var(--primary-dark); background: var(--primary-soft); border-color: #b8bef4; font-weight: 650; }
    .quick-add-group-option input:focus-visible + span { outline: 3px solid rgba(88, 101, 217, .14); border-color: var(--primary); }
    .quick-add-note { color: var(--subtle); font-size: 11px; }
    .quick-add-note.warning { color: var(--warning); }
    .auth-link-box { display: grid; gap: 8px; padding: 12px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 11px; }
    .auth-link-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .auth-link { display: block; min-width: 0; flex: 1; overflow-wrap: anywhere; color: var(--primary-dark); font-size: 12px; line-height: 1.45; word-break: break-all; white-space: normal; }
    .auth-link.empty { color: var(--subtle); pointer-events: none; }
    .auth-link-row button { flex: 0 0 auto; padding: 7px 9px; font-size: 11px; }
    .modal-status { color: var(--muted); font-size: 12px; }
    .modal-status.error { color: var(--danger); }
    .modal-status.loading { color: var(--primary); }
    .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 9px; padding: 15px 22px 18px; border-top: 1px solid var(--line); }
    .quick-add-compact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }

    @media (max-width: 980px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .quick-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .proxy-head { grid-template-columns: minmax(190px, 1fr) auto auto; }
      .proxy-action { grid-column: 1 / -1; }
      .proxy-action button { width: 100%; }
      .account-head, .account { grid-template-columns: 26px minmax(150px, 1.2fr) minmax(125px, .95fr) minmax(105px, .8fr) minmax(125px, .9fr); }
      .account-head span:last-child, .account .usage { grid-column: 2 / -1; }
      .account .usage { padding: 0 0 12px; }
      .account { min-height: 93px; padding-top: 12px; }
    }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 24px, 1480px); padding-top: 22px; }
      .top { flex-direction: column; margin-bottom: 20px; }
      .connection { width: 100%; }
      .summary { gap: 9px; }
      .metric { min-height: 78px; padding: 12px; gap: 9px; }
      .metric-icon { width: 32px; height: 32px; flex-basis: 32px; }
      .metric-icon svg { width: 16px; height: 16px; }
      .metric-value { font-size: 19px; }
      .metric-action { padding: 6px 7px; font-size: 10px; }
      .assign { align-items: stretch; flex-direction: column; gap: 11px; padding: 14px; }
      .assign-copy, .assign-controls { justify-content: space-between; }
      .assign-controls { flex-wrap: wrap; }
      .assign-controls select { flex: 1; min-width: 0; }
      .status { text-align: left; }
      .quick-dispatch { padding: 15px 14px 16px; }
      .quick-cards { grid-template-columns: 1fr; }
      .quick-head { flex-direction: column; gap: 8px; }
      .quick-selected { align-self: flex-start; }
      .quick-filter-row { flex-direction: column; gap: 7px; }
      .quick-filter-label { padding-top: 0; }
      .proxy-head { grid-template-columns: 1fr auto; gap: 12px; padding: 15px; }
      .proxy-latency { grid-column: 1; text-align: left; }
      .proxy-count { grid-column: 2; grid-row: 2; }
      .proxy-action { grid-column: 1 / -1; }
      .accounts { padding: 0 14px 4px; }
      .account-head { display: none; }
      .account { grid-template-columns: 24px minmax(0, 1fr) auto; gap: 9px; min-height: 0; padding: 14px 0; }
      .account .status-cell { grid-column: 3; grid-row: 1; }
      .account .group-cell { grid-column: 2 / -1; }
      .account .schedule-cell { grid-column: 2 / -1; }
      .account .usage { grid-column: 2 / -1; padding: 0; }
      .status-cell small { max-width: 100px; }
      .quick-add-grid { grid-template-columns: 1fr; }
      .quick-add-compact-grid { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 12px; }
      .modal-head, .modal-body, .modal-foot { padding-left: 15px; padding-right: 15px; }
      .auth-link-row { flex-wrap: wrap; }
      .auth-link { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4.5 6.2v5.1c0 4.6 3.1 7.9 7.5 9.7 4.4-1.8 7.5-5.1 7.5-9.7V6.2L12 3Z"></path>
            <path d="m8.5 12 2.2 2.2 4.8-4.8"></path>
          </svg>
        </div>
        <div>
          <div class="eyebrow">Sub2API · Admin</div>
          <h1 class="title">OAuth 账号管理</h1>
          <div class="sub">代理、OpenAI OAuth 账号与调度状态</div>
        </div>
      </div>
      <div class="connection" id="connection">
        <span class="connection-dot pending" id="connectionDot"></span>
        <div>
          <strong id="connectionText">检查登录状态</strong>
          <small>复用 Sub2API 同源登录态</small>
        </div>
      </div>
    </header>

    <section class="summary" aria-label="概览">
      <div class="metric">
        <div class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h.01M11 9h6M7 13h10"></path></svg>
        </div>
        <div><span class="metric-label">代理</span><strong class="metric-value" id="proxyCount">—</strong><span class="metric-note">已配置代理</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.7-3 2.5-4.5 5.5-4.5s4.8 1.5 5.5 4.5M16 11a2.5 2.5 0 1 0 0-5M16 14.5c2.4 0 3.9 1.2 4.5 3.5"></path></svg>
        </div>
        <div><span class="metric-label">OAuth 账号</span><strong class="metric-value" id="accountCount">—</strong><span class="metric-note">OpenAI OAuth</span></div>
        <button class="metric-action" id="quickAddButton" type="button" disabled>快速添加</button>
      </div>
      <div class="metric">
        <div class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.2 4.2L19 6.5"></path><circle cx="12" cy="12" r="9"></circle></svg>
        </div>
        <div><span class="metric-label">调度中</span><strong class="metric-value" id="scheduledCount">—</strong><span class="metric-note">参与账号调度</span></div>
      </div>
      <div class="metric">
        <div class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19h18.4L12 3Z"></path><path d="M12 9v4.5M12 17h.01"></path></svg>
        </div>
        <div><span class="metric-label">需要关注</span><strong class="metric-value" id="attentionCount">—</strong><span class="metric-note">错误、限流或异常</span></div>
      </div>
    </section>

    <section class="panel quick-dispatch" id="quickDispatch" aria-label="快速调度">
      <div class="quick-head">
        <div>
          <div class="section-kicker">快速调度</div>
          <h2 class="quick-title">按分组快速切换账号调度</h2>
          <p class="quick-description">绿色为调度中，灰色为暂停中；点击方块即可切换。</p>
        </div>
        <span class="quick-selected" id="quickSelected">已选 0 个分组</span>
      </div>
      <div class="quick-filter-row">
        <span class="quick-filter-label">分组</span>
        <div class="quick-groups" id="quickGroups" aria-label="选择快速调度分组">
          <span class="quick-note">正在加载分组…</span>
        </div>
      </div>
      <div id="quickCards" class="quick-cards" aria-live="polite">
        <div class="loading-state">正在加载快速调度…</div>
      </div>
    </section>

    <section class="panel assign">
      <div class="assign-copy">
        <span class="section-kicker">批量操作</span>
        <strong>移动选中的账号</strong>
        <span id="selected" class="selected">已选 0 个账号</span>
      </div>
      <div class="assign-controls">
        <select id="target" aria-label="选择目标代理">
          <option value="">选择目标代理…</option>
        </select>
        <button class="primary" id="move" type="button" disabled>移动账号</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </section>

    <div id="list" aria-live="polite">
      <div class="loading-state">正在加载代理和账号…</div>
    </div>
  </main>

  <div class="modal-backdrop" id="quickAddModal" hidden aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="quickAddTitle">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="quickAddTitle">快速添加 OAuth 账号</h2>
          <p class="modal-description">自动分配账号最少的可用代理，授权完成后使用邮箱创建账号。</p>
        </div>
        <button class="modal-close" type="button" data-close-quick-add aria-label="关闭快速添加">×</button>
      </div>
      <div class="modal-body">
        <div class="quick-add-grid">
          <label class="form-field">
            <span class="form-label">代理</span>
            <select id="quickAddProxy" aria-label="选择快速添加代理"></select>
          </label>
          <label class="form-field">
            <span class="form-label">模型限制</span>
            <input id="quickAddModel" type="text" value="gpt-5.6-luna" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <div class="quick-add-compact-grid">
          <label class="form-field">
            <span class="form-label">并发数</span>
            <input id="quickAddConcurrency" type="number" min="1" step="1" value="2" inputmode="numeric">
            <span class="form-hint">单个账号允许的同时请求数</span>
          </label>
          <label class="form-field">
            <span class="form-label">优先级</span>
            <input id="quickAddPriority" type="number" min="0" step="1" value="1" inputmode="numeric">
            <span class="form-hint">数值越小，调度优先级越高</span>
          </label>
          <label class="form-field">
            <span class="form-label">Codex 指纹收敛</span>
            <select id="quickAddFingerprintMode" aria-label="选择 Codex 指纹收敛模式">
              <option value="off" selected>关闭</option>
              <option value="device">设备级</option>
              <option value="session">会话级</option>
              <option value="full">完全收敛</option>
            </select>
            <span class="form-hint">非关闭模式由后端自动管理指纹</span>
          </label>
        </div>

        <div class="form-field">
          <span class="form-label">分组</span>
          <div class="quick-add-groups" id="quickAddGroups" aria-label="选择快速添加分组"></div>
          <span class="quick-add-note" id="quickAddGroupNote"></span>
        </div>

        <div class="form-field">
          <span class="form-label">授权链接</span>
          <div class="auth-link-box">
            <div class="auth-link-row">
              <a class="auth-link empty" id="quickAddAuthLink" href="#" target="_blank" rel="noopener noreferrer">正在生成…</a>
              <button id="quickAddCopy" type="button" disabled>复制</button>
              <button id="quickAddRefresh" type="button">刷新</button>
            </div>
          </div>
        </div>

        <label class="form-field">
          <span class="form-label">授权回调 URL</span>
          <textarea id="quickAddCallback" placeholder="粘贴授权完成后的回调 URL" spellcheck="false"></textarea>
        </label>
        <div class="modal-status" id="quickAddStatus" role="status" aria-live="polite"></div>
      </div>
      <div class="modal-foot">
        <button type="button" data-close-quick-add>取消</button>
        <button class="primary" id="quickAddSubmit" type="button" disabled>授权并添加</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const state = {
        proxies: [],
        groups: [],
        accounts: [],
        latency: {},
        selected: new Set(),
        quickGroupIDs: new Set(),
        quickGroupsInitialized: false,
        scheduleUpdating: new Set(),
        loading: false,
        loaded: false,
        quickAdd: {
          proxyId: '',
          sessionId: '',
          authUrl: '',
          groupIDs: new Set(),
          missingGroups: [],
          generating: false,
          submitting: false,
          requestVersion: 0
        }
      };

      const statusLabels = {
        active: '正常',
        normal: '正常',
        inactive: '已停用',
        error: '错误',
        expired: '已过期',
        rate_limited: '限流中',
        overloaded: '过载',
        temp_unschedulable: '暂不可调度',
        unknown: '未知状态'
      };

      const proxyStatusLabels = {
        active: '运行中',
        inactive: '已停用',
        expired: '已过期',
        error: '错误'
      };

      const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);

      const unwrap = (json) => {
        if (!json || json.code === undefined) return json;
        if (json.code === 0) return json.data;
        throw new Error(json.message || 'API 返回错误');
      };

      function readStorage(key) {
        try {
          return localStorage.getItem(key) || '';
        } catch {
          return '';
        }
      }

      function readAuthToken() {
        return readStorage('auth_token').trim();
      }

      let refreshingToken = null;
      async function refreshAuthToken() {
        if (refreshingToken) return refreshingToken;
        const refreshToken = readStorage('refresh_token').trim();
        if (!refreshToken) return false;

        refreshingToken = (async () => {
          try {
            const response = await fetch('/api/v1/auth/refresh', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh_token: refreshToken })
            });
            const json = await response.json();
            if (!response.ok) return false;
            const tokens = unwrap(json);
            if (!tokens?.access_token) return false;
            localStorage.setItem('auth_token', tokens.access_token);
            if (tokens.refresh_token) localStorage.setItem('refresh_token', tokens.refresh_token);
            if (tokens.expires_in) localStorage.setItem('token_expires_at', String(Date.now() + tokens.expires_in * 1000));
            return true;
          } catch {
            return false;
          }
        })().finally(() => {
          refreshingToken = null;
        });
        return refreshingToken;
      }

      async function api(path, options = {}, canRefresh = true) {
        const token = readAuthToken();
        if (!token) throw new Error('请先登录 Sub2API');
        const response = await fetch('/api/v1' + path, {
          ...options,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
            ...(options.headers || {})
          }
        });
        if (response.status === 401 && canRefresh && await refreshAuthToken()) return api(path, options, false);
        let json;
        try {
          json = await response.json();
        } catch {
          throw new Error('服务器返回了非 JSON 内容（HTTP ' + response.status + '）');
        }
        if (!response.ok) throw new Error(json.message || json.error || ('HTTP ' + response.status));
        return unwrap(json);
      }

      const arrayFrom = (value) => {
        if (Array.isArray(value)) return value;
        if (value && Array.isArray(value.items)) return value.items;
        return [];
      };

      async function allPages(path, params = {}) {
        let page = 1;
        const result = [];
        while (page <= 100) {
          const query = new URLSearchParams({ ...params, page: String(page), page_size: '100' });
          const data = await api(path + '?' + query);
          const items = arrayFrom(data);
          result.push(...items);
          const totalPages = Number(data?.total_pages || data?.pages || 0);
          if ((totalPages && page >= totalPages) || items.length < 100) break;
          page += 1;
        }
        return result;
      }

      function proxyId(proxy) {
        return proxy.id ?? proxy.proxy_id;
      }

      function proxyName(proxy) {
        return proxy.name || proxy.host || ('代理 #' + proxyId(proxy));
      }

      function accountName(account) {
        return account.name || account.email || account.account || ('账号 #' + account.id);
      }

      function groupId(group) {
        return group?.id ?? group?.group_id;
      }

      function groupName(group) {
        return group?.name || group?.title || group?.label || ('分组 #' + groupId(group));
      }

      function normalizedGroupName(value) {
        return String(value || '').trim().toLowerCase();
      }

      function compactGroupName(value) {
        return String(value || '').trim().toLowerCase().replace(/\s+/g, '');
      }

      function valueAsID(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : value;
      }

      function accountGroupIDs(account) {
        const source = Array.isArray(account.group_ids)
          ? account.group_ids
          : (Array.isArray(account.groups) ? account.groups : []);
        return source.map((item) => typeof item === 'object' ? groupId(item) : item)
          .filter((id) => id != null)
          .map((id) => String(id));
      }

      function accountGroups(account) {
        return accountGroupIDs(account).map((id) => {
          const group = state.groups.find((item) => String(groupId(item)) === id);
          return group || { id, name: '分组 #' + id };
        });
      }

      function accountGroupsMarkup(account) {
        const groups = accountGroups(account);
        if (!groups.length) {
          return '<div class="account-groups"><span class="account-groups-empty">未分组</span></div>';
        }

        const labels = groups.map((group) => groupName(group));
        return '<div class="account-groups" title="' + escapeHTML(labels.join('、')) + '">' +
          labels.map((label) => '<span class="account-group" title="' + escapeHTML(label) + '">' + escapeHTML(label) + '</span>').join('') +
          '</div>';
      }

      function statusKey(value) {
        return String(value || 'unknown').toLowerCase().replace(/[^a-z0-9_]+/g, '_');
      }

      function isFuture(value) {
        if (!value) return false;
        const timestamp = new Date(value).getTime();
        return Number.isFinite(timestamp) && timestamp > Date.now();
      }

      function activeModelRateLimit(account) {
        const modelLimits = account.extra?.model_rate_limits;
        if (!modelLimits || typeof modelLimits !== 'object') return false;
        return Object.values(modelLimits).some((item) => isFuture(item?.rate_limit_reset_at));
      }

      function accountStatus(account) {
        let key = statusKey(account.status);
        let detail = '';

        if (isFuture(account.rate_limit_reset_at) || activeModelRateLimit(account)) {
          key = 'rate_limited';
          detail = account.rate_limit_reset_at ? '预计 ' + formatDate(account.rate_limit_reset_at) + ' 恢复' : '模型限流中';
        } else if (isFuture(account.overload_until)) {
          key = 'overloaded';
          detail = '预计 ' + formatDate(account.overload_until) + ' 恢复';
        } else if (isFuture(account.temp_unschedulable_until)) {
          key = 'temp_unschedulable';
          detail = '预计 ' + formatDate(account.temp_unschedulable_until) + ' 恢复';
        }

        if (!statusLabels[key]) {
          key = 'unknown';
          detail = account.status ? '原始状态：' + account.status : '';
        }

        if (key === 'error' && account.error_message) detail = account.error_message;
        return { key, label: statusLabels[key], detail };
      }

      function quickAccountStatus(accountState) {
        if (accountState.key === 'active' || accountState.key === 'normal') {
          return { key: 'normal', label: '正常' };
        }
        if (['rate_limited', 'overloaded', 'temp_unschedulable'].includes(accountState.key)) {
          return { key: 'limited', label: '限流' };
        }
        return { key: 'error', label: '错误' };
      }

      function formatDate(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return '';
        return date.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function formatLatency(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.round(number) + ' ms' : '未测试';
      }

      function latencyClass(value) {
        if (value == null) return '';
        return value < 300 ? 'good' : value < 800 ? 'warn' : 'bad';
      }

      function averageLatency(samples) {
        const valid = samples.filter((sample) => Number.isFinite(sample));
        return valid.length ? valid.reduce((sum, sample) => sum + sample, 0) / valid.length : null;
      }

      function latencyView(info) {
        const samples = Array.isArray(info?.samples) ? info.samples : [];
        const recent = samples.length ? samples.map((sample) => sample === null ? '失败' : formatLatency(sample)).join(' / ') : '未测试';
        const main = info?.testing ? '测试中…' : '平均 ' + formatLatency(info?.average);
        const detail = '近三次：' + recent + (info?.testing ? ' · ' + samples.length + '/3' : '');
        return { main, detail };
      }

      async function testProxy(proxyID) {
        const key = String(proxyID);
        const samples = [];
        let lastError = '';
        state.latency[key] = { samples: [], average: null, testing: true, error: '' };
        render();

        for (let index = 0; index < 3; index += 1) {
          try {
            const data = await api('/admin/proxies/' + proxyID + '/test', { method: 'POST' });
            const value = Number(data?.latency_ms ?? data?.latency);
            if (Number.isFinite(value) && value >= 0) samples.push(value);
            else {
              samples.push(null);
              lastError = '接口未返回有效延迟';
            }
          } catch (error) {
            samples.push(null);
            lastError = error.message || '代理测试失败';
          }
          state.latency[key] = {
            samples: [...samples],
            average: averageLatency(samples),
            testing: index < 2,
            error: lastError
          };
          render();
        }
        return state.latency[key];
      }

      async function testAllProxies() {
        const proxies = state.proxies.filter((proxy) => proxyId(proxy) != null);
        if (!proxies.length) return;
        let finished = 0;
        setStatus('正在测试代理延迟（0/' + proxies.length + '）', false, true);
        await Promise.all(proxies.map(async (proxy) => {
          await testProxy(proxyId(proxy));
          finished += 1;
          setStatus('正在测试代理延迟（' + finished + '/' + proxies.length + '）', false, true);
        }));
      }

      function proxyStatus(proxy) {
        const raw = statusKey(proxy.status);
        return { raw, label: proxyStatusLabels[raw] || proxy.status || '未知状态' };
      }

      function usage(account) {
        const extra = account.extra || {};
        const percent = Number(extra.codex_7d_used_percent);
        if (!Number.isFinite(percent)) {
          return '<div class="usage"><div class="usage-top"><strong>暂无快照</strong><span>7d 用量</span></div><span class="usage-note">暂无已保存用量数据</span></div>';
        }

        const value = clampUsagePercent(percent);
        const resetAt = extra.codex_7d_reset_at ? formatDate(extra.codex_7d_reset_at) : '';
        const updatedAt = extra.codex_usage_updated_at ? formatDate(extra.codex_usage_updated_at) : '';
        const note = resetAt ? '重置 ' + resetAt : (updatedAt ? '更新 ' + updatedAt : '已保存快照');
        return '<div class="usage" title="' + escapeHTML((updatedAt ? '更新：' + updatedAt + '；' : '') + (resetAt ? '重置：' + resetAt : '')) + '">' +
          '<div class="usage-top"><strong>' + formatUsagePercent(value) + '</strong><span>7d 已使用</span></div>' +
          '<div class="usage-bar"><b style="width:' + value + '%"></b></div>' +
          '<span class="usage-note">' + escapeHTML(note) + '</span></div>';
      }

      function clampUsagePercent(value) {
        if (value == null) return null;
        const number = Number(value);
        return Number.isFinite(number) ? Math.max(0, Math.min(100, number)) : null;
      }

      function formatUsagePercent(value) {
        const number = clampUsagePercent(value);
        return number == null ? '—' : Math.round(number) + '%';
      }

      function accountUsagePercent(account) {
        const value = Number(account.extra?.codex_7d_used_percent);
        return Number.isFinite(value) ? value : null;
      }

      function sortedAccounts(accounts) {
        return [...accounts].sort((left, right) => {
          const scheduleOrder = Number(Boolean(right.schedulable)) - Number(Boolean(left.schedulable));
          if (scheduleOrder) return scheduleOrder;

          const leftUsage = accountUsagePercent(left);
          const rightUsage = accountUsagePercent(right);
          if (leftUsage == null && rightUsage != null) return 1;
          if (leftUsage != null && rightUsage == null) return -1;
          if (leftUsage != null && rightUsage != null && leftUsage !== rightUsage) return leftUsage - rightUsage;

          return accountName(left).localeCompare(accountName(right), 'zh-CN') || Number(left.id) - Number(right.id);
        });

      function compareProxyIDs(left, right) {
        const leftNumber = Number(proxyId(left));
        const rightNumber = Number(proxyId(right));
        if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber) && leftNumber !== rightNumber) return leftNumber - rightNumber;
        return String(proxyId(left)).localeCompare(String(proxyId(right)), 'en', { numeric: true });
      }

      function leastLoadedProxy(proxies) {
        return [...proxies].sort((left, right) => {
          const countOrder = proxyAccountCount(proxyId(left)) - proxyAccountCount(proxyId(right));
          return countOrder || compareProxyIDs(left, right);
        })[0] || null;
      }

      async function generateQuickAddAuthURL() {
        const proxyID = state.quickAdd.proxyId;
        if (!proxyID) {
          setQuickAddStatus('请选择一个可用代理', true);
          updateQuickAddModalControls();
          return false;
        }

        const version = state.quickAdd.requestVersion;
        state.quickAdd.generating = true;
        state.quickAdd.sessionId = '';
        state.quickAdd.authUrl = '';
        setQuickAddStatus('正在生成授权链接…', false, true);
        updateQuickAddModalControls();

        try {
          const data = await api('/admin/openai/generate-auth-url', {
            method: 'POST',
            body: JSON.stringify({ proxy_id: valueAsID(proxyID) })
          });
          if (state.quickAdd.requestVersion !== version) return false;

          const authURL = data?.auth_url || data?.url;
          const sessionID = data?.session_id || data?.sessionId;
          if (!authURL || !sessionID) throw new Error('授权链接接口未返回有效会话');
          state.quickAdd.authUrl = String(authURL);
          state.quickAdd.sessionId = String(sessionID);
          setQuickAddStatus('');
          return true;
        } catch (error) {
          if (state.quickAdd.requestVersion !== version) return false;
          setQuickAddStatus(error.message || '授权链接生成失败', true);
          return false;
        } finally {
          if (state.quickAdd.requestVersion === version) {
            state.quickAdd.generating = false;
            updateQuickAddModalControls();
          }
        }
      }

      function parseAuthorizationCallback(value) {
        const input = String(value || '').trim();
        if (!input) throw new Error('请先粘贴授权回调 URL');

        let searchParams = new URLSearchParams();
        let hashParams = new URLSearchParams();
        try {
          const url = new URL(input, window.location.origin);
          searchParams = url.searchParams;
          hashParams = new URLSearchParams(url.hash.replace(/^#/, '').replace(/^\?/, ''));
        } catch {
          // 下面的原始参数解析兼容只粘贴 query string 的情况。
        }

        const rawQuery = input.includes('?') ? input.slice(input.indexOf('?') + 1).split('#')[0] : input;
        const rawParams = new URLSearchParams(rawQuery);
        const code = searchParams.get('code') || hashParams.get('code') || rawParams.get('code');
        const stateValue = searchParams.get('state') || hashParams.get('state') || rawParams.get('state');
        const errorValue = searchParams.get('error') || hashParams.get('error') || rawParams.get('error');
        if (errorValue) throw new Error('授权失败：' + errorValue);
        if (!code || !stateValue) throw new Error('回调 URL 中缺少 code 或 state');
        return { code, state: stateValue };
      }

      function exchangeEmail(data) {
        return String(data?.email || data?.account_email || data?.user_email || data?.account?.email || data?.credentials?.email || data?.user?.email || '').trim();
      }

      function exchangeCredentials(data) {
        const source = data?.credentials && typeof data.credentials === 'object' ? data.credentials : data;
        if (!source || typeof source !== 'object' || Array.isArray(source)) return null;
        const credentials = { ...source };
        delete credentials.code;
        delete credentials.state;
        delete credentials.session_id;
        delete credentials.auth_url;
        delete credentials.message;
        return credentials;
      }

      async function submitQuickAdd() {
        if (state.quickAdd.submitting || state.quickAdd.generating) return;

        const proxyID = state.quickAdd.proxyId;
        const model = String($('#quickAddModel')?.value || '').trim();
        const concurrencyValue = String($('#quickAddConcurrency')?.value || '').trim();
        const priorityValue = String($('#quickAddPriority')?.value || '').trim();
        const fingerprintMode = String($('#quickAddFingerprintMode')?.value || 'off').trim();
        const concurrency = Number(concurrencyValue);
        const priority = Number(priorityValue);
        const proxy = activeProxies().find((item) => String(proxyId(item)) === String(proxyID));
        if (!proxy) return setQuickAddStatus('请选择一个 active 代理', true);
        if (!model) return setQuickAddStatus('模型限制不能为空', true);
        if (!concurrencyValue || !Number.isInteger(concurrency) || concurrency < 1) return setQuickAddStatus('并发数必须是大于等于 1 的整数', true);
        if (!priorityValue || !Number.isInteger(priority) || priority < 0) return setQuickAddStatus('优先级必须是大于等于 0 的整数', true);
        if (!['off', 'device', 'session', 'full'].includes(fingerprintMode)) return setQuickAddStatus('Codex 指纹收敛模式无效', true);
        if (!state.quickAdd.sessionId) return setQuickAddStatus('请先生成授权链接', true);

        let callback;
        try {
          callback = parseAuthorizationCallback($('#quickAddCallback')?.value);
        } catch (error) {
          return setQuickAddStatus(error.message || '授权回调 URL 无效', true);
        }

        const version = state.quickAdd.requestVersion;
        const groupIDs = [...state.quickAdd.groupIDs]
          .filter((id) => state.groups.some((group) => String(groupId(group)) === String(id)))
          .map(valueAsID);
        const proxyValue = valueAsID(proxyID);
        state.quickAdd.submitting = true;
        updateQuickAddModalControls();

        try {
          setQuickAddStatus('正在交换 OAuth 授权…', false, true);
          const exchanged = await api('/admin/openai/exchange-code', {
            method: 'POST',
            body: JSON.stringify({
              session_id: state.quickAdd.sessionId,
              code: callback.code,
              state: callback.state,
              proxy_id: proxyValue
            })
          });
          if (state.quickAdd.requestVersion !== version) return;

          const email = exchangeEmail(exchanged);
          if (!email) throw new Error('授权结果中没有找到邮箱，无法填充账号名称');
          const credentials = exchangeCredentials(exchanged);
          if (!credentials) throw new Error('授权结果中没有有效的 OAuth 凭据');
          credentials.model_mapping = { [model]: model };

          setQuickAddStatus('授权成功，正在创建账号…', false, true);
          await api('/admin/accounts', {
            method: 'POST',
            body: JSON.stringify({
              name: email,
              platform: 'openai',
              type: 'oauth',
              credentials,
              proxy_id: proxyValue,
              concurrency,
              priority,
              extra: fingerprintMode === 'off' ? {} : { codex_fingerprint_mode: fingerprintMode },
              group_ids: groupIDs
            })
          });
          if (state.quickAdd.requestVersion !== version) return;

          state.quickAdd.submitting = false;
          closeQuickAdd();
          await load();
          setStatus('已快速添加账号：' + email);
        } catch (error) {
          if (state.quickAdd.requestVersion !== version) return;
          state.quickAdd.sessionId = '';
          setQuickAddStatus(error.message || '快速添加失败；请刷新授权链接后重试', true);
        } finally {
          if (state.quickAdd.requestVersion === version) {
            state.quickAdd.submitting = false;
            updateQuickAddModalControls();
          }
        }
      }

      async function copyQuickAddAuthURL() {
        const value = state.quickAdd.authUrl;
        if (!value) return;

        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(value);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = value;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('浏览器拒绝了复制操作');
          }
          setQuickAddStatus('授权链接已复制');
        } catch (error) {
          setQuickAddStatus(error.message || '复制失败，请手动复制链接', true);
        }
      }

      async function openQuickAdd() {
        if (!state.loaded || state.loading) return;
        const proxies = activeProxies();
        const defaultProxy = leastLoadedProxy(proxies);
        if (!defaultProxy) return alert('当前没有状态为 active 的代理，暂时无法添加账号');

        const defaults = quickAddDefaultGroups();
        state.quickAdd = {
          proxyId: String(proxyId(defaultProxy)),
          sessionId: '',
          authUrl: '',
          groupIDs: defaults.groupIDs,
          missingGroups: defaults.missing,
          generating: false,
          submitting: false,
          requestVersion: state.quickAdd.requestVersion + 1
        };
        $('#quickAddModel').value = 'gpt-5.6-luna';
        $('#quickAddConcurrency').value = '2';
        $('#quickAddPriority').value = '1';
        $('#quickAddFingerprintMode').value = 'off';
        $('#quickAddCallback').value = '';
        renderQuickAddProxyOptions();
        renderQuickAddGroups();
        renderQuickAddAuthLink();
        setQuickAddStatus('准备生成授权链接…', false, true);
        const modal = $('#quickAddModal');
        modal.hidden = false;
        modal.setAttribute('aria-hidden', 'false');
        updateQuickAddModalControls();
        $('#quickAddProxy').focus();
        await generateQuickAddAuthURL();

      function closeQuickAdd() {
        if (state.quickAdd.submitting) return;
        state.quickAdd.requestVersion += 1;
        state.quickAdd.generating = false;
        const modal = $('#quickAddModal');
        if (!modal) return;
        modal.hidden = true;
        modal.setAttribute('aria-hidden', 'true');
        updateQuickAddButton();
      }

      async function toggleSchedule(account, trigger) {
        const accountID = String(account.id);
        if (state.scheduleUpdating.has(accountID)) return;

        state.scheduleUpdating.add(accountID);
        if (trigger) {
          trigger.disabled = true;
          trigger.setAttribute('aria-busy', 'true');
        }

        try {
          const desired = !Boolean(account.schedulable);
          const updated = await api('/admin/accounts/' + account.id + '/schedulable', {
            method: 'POST',
            body: JSON.stringify({ schedulable: desired })
          });
          account.schedulable = updated?.schedulable ?? desired;
        } catch (error) {
          alert(error.message || '调度状态更新失败');
        } finally {
          state.scheduleUpdating.delete(accountID);
          render();
        }
      }

      function render() {
        const groups = new Map(state.proxies.map((proxy) => [String(proxyId(proxy)), { proxy, accounts: [] }]));
        groups.set('uncategorized', { proxy: { id: null, name: '未分类' }, accounts: [] });

          '<option value="__uncategorized">未分类（清除代理）</option>';

        $('#list').innerHTML = [...groups.values()].map(({ proxy, accounts }) => {
          const id = proxyId(proxy);
          const key = id == null ? 'uncategorized' : String(id);
          const latency = state.latency[key];
          const latencyText = latencyView(latency);
          const proxyState = proxyStatus(proxy);
          const proxyMeta = id == null ? '' : '<div class="meta proxy-meta">ID ' + escapeHTML(id) + ' · 原始状态 ' + escapeHTML(proxyState.raw) + '</div>';
          const latencyMarkup = id == null ? '' : '<div class="proxy-latency ' + latencyClass(latency?.average) + '"><strong>' + escapeHTML(latencyText.main) + '</strong><small>' + escapeHTML(latencyText.detail) + '</small></div>';
          const actionMarkup = id == null ? '' : '<div class="proxy-action"><button type="button" data-test="' + escapeHTML(id) + '">重新测试</button></div>';
          const sorted = sortedAccounts(accounts);
          const accountRows = sorted.length ? sorted.map((account) => {
            const accountState = accountStatus(account);
            const name = accountName(account);
            const detail = accountState.detail || (account.notes ? String(account.notes) : '');
            const updating = state.scheduleUpdating.has(String(account.id));
            return '<div class="account">' +
              '<input class="account-check" type="checkbox" data-select="' + escapeHTML(account.id) + '" ' + (state.selected.has(String(account.id)) ? 'checked' : '') + ' aria-label="选择 ' + escapeHTML(name) + '">' +
              '<div class="account-main"><div class="account-name" title="' + escapeHTML(name) + '">' + escapeHTML(name) + '<span class="account-id">#' + escapeHTML(account.id) + '</span></div><div class="account-detail">' + escapeHTML(account.platform === 'openai' ? 'OpenAI OAuth' : (account.platform || 'OAuth')) + '</div></div>' +
              '<div class="group-cell">' + accountGroupsMarkup(account) + '</div>' +
              '<div class="status-cell"><span class="badge ' + escapeHTML(accountState.key.replace(/_/g, '-')) + '" title="' + escapeHTML(accountState.detail) + '">' + escapeHTML(accountState.label) + '</span>' + (detail ? '<small title="' + escapeHTML(detail) + '">' + escapeHTML(detail) + '</small>' : '') + '</div>' +
              '<div class="schedule-cell"><button class="schedule-button" type="button" data-schedule="' + escapeHTML(account.id) + '" title="' + (account.schedulable ? '暂停调度' : '启用调度') + '"' + (updating ? ' disabled aria-busy="true"' : '') + '><span class="switch ' + (account.schedulable ? 'on' : '') + '"><i></i></span><span class="schedule-label ' + (account.schedulable ? 'on' : '') + '">' + (account.schedulable ? '调度中' : '已暂停') + '</span></button></div>' +
              usage(account) +
              '</div>';
          }).join('') : '<div class="empty"><strong>暂无账号</strong>该代理当前没有绑定 OpenAI OAuth 账号</div>';

          const proxyStatusMarkup = id == null ? '<span class="proxy-status inactive">未绑定</span>' : '<span class="proxy-status ' + escapeHTML(proxyState.raw) + '">' + escapeHTML(proxyState.label) + '</span>';
          const proxyDotClass = id == null ? 'inactive' : proxyState.raw;
          return '<section class="panel proxy"><div class="proxy-head' + (id == null ? ' unbound' : '') + '">' +
            '<div class="proxy-heading"><div class="proxy-name-line"><span class="proxy-dot ' + escapeHTML(proxyDotClass) + '"></span><span class="proxy-name" title="' + escapeHTML(proxyName(proxy)) + '">' + escapeHTML(proxyName(proxy)) + '</span>' + proxyStatusMarkup + '</div>' + proxyMeta + '</div>' +
            latencyMarkup +
            '<div class="proxy-count"><span class="count">' + sorted.length + '</span><span class="meta">OAuth 账号</span></div>' +
            actionMarkup + '</div>' +
            '<div class="accounts"><div class="account-head"><span></span><span>账号</span><span>分组</span><span>状态</span><span>调度</span><span>Codex 7d 用量</span></div>' + accountRows + '</div></section>';
        }).join('');

        $('#selected').textContent = '已选 ' + state.selected.size + ' 个账号';
        $('#move').disabled = state.selected.size === 0;
        if (state.quickGroupsInitialized) renderQuickGroups();
        renderQuickCards();
        updateSummary();
        updateQuickAddButton();
      }

      async function load() {
        if (state.loading) return;
        if (!readAuthToken()) {
          state.loaded = false;
          updateConnection();
          updateQuickAddButton();
          setStatus('请先登录 Sub2API', true);
          $('#list').innerHTML = '<div class="loading-state"><strong>尚未检测到登录态</strong>请先登录 Sub2API，再打开本页面</div>';
          $('#quickGroups').innerHTML = '<span class="quick-note">登录后加载分组</span>';
          $('#quickSelected').textContent = '未加载';
          $('#quickCards').innerHTML = '<div class="loading-state"><strong>尚未检测到登录态</strong>请先登录 Sub2API，再打开本页面</div>';
          return;
        }

        state.loading = true;
        updateConnection();
        setStatus('正在加载…', false, true);
        $('#list').classList.add('loading');
        try {
          const [proxies, accounts, groupData] = await Promise.all([
            allPages('/admin/proxies'),
            allPages('/admin/accounts', { platform: 'openai', type: 'oauth', lite: '1' }),
            api('/admin/groups/all?include_inactive=true')
          ]);
          state.proxies = proxies;
          state.groups = arrayFrom(groupData);
          state.accounts = accounts.filter((account) => String(account.platform || '').toLowerCase() === 'openai' && String(account.type || '').toLowerCase() === 'oauth');
          state.selected = new Set([...state.selected].filter((id) => state.accounts.some((account) => String(account.id) === id)));
          initializeQuickGroups();
          state.loaded = true;
          render();
          await testAllProxies();
          setStatus('已加载 ' + state.proxies.length + ' 个代理、' + state.groups.length + ' 个分组、' + state.accounts.length + ' 个 OpenAI OAuth 账号');
        } catch (error) {
          state.loaded = false;
          setStatus(error.message || '加载失败', true);
          $('#list').innerHTML = '<div class="loading-state"><strong>数据加载失败</strong>' + escapeHTML(error.message || '请稍后重试') + '</div>';
          $('#quickGroups').innerHTML = '<span class="quick-note">分组加载失败</span>';
          $('#quickSelected').textContent = '加载失败';
          $('#quickCards').innerHTML = '<div class="loading-state"><strong>快速调度加载失败</strong>' + escapeHTML(error.message || '请稍后重试') + '</div>';
        } finally {
          state.loading = false;
          $('#list').classList.remove('loading');
          updateQuickAddButton();
        }
      }

      $('#quickAddButton').addEventListener('click', openQuickAdd);

      $('#quickAddProxy').addEventListener('change', async (event) => {
        state.quickAdd.proxyId = event.target.value;
        state.quickAdd.sessionId = '';
        state.quickAdd.authUrl = '';
        $('#quickAddCallback').value = '';
        renderQuickAddProxyOptions();
        setQuickAddStatus('代理已切换，正在生成新的授权链接…', false, true);
        await generateQuickAddAuthURL();
      });

      $('#quickAddGroups').addEventListener('change', (event) => {
        const input = event.target.closest('input[data-quick-add-group]');
        if (!input) return;
        const id = String(input.dataset.quickAddGroup);
        if (input.checked) state.quickAdd.groupIDs.add(id);
        else state.quickAdd.groupIDs.delete(id);
        renderQuickAddGroups();
      });

      $('#quickAddRefresh').addEventListener('click', async () => {
        $('#quickAddCallback').value = '';
        await generateQuickAddAuthURL();
      });

      $('#quickAddCopy').addEventListener('click', copyQuickAddAuthURL);
      $('#quickAddSubmit').addEventListener('click', submitQuickAdd);

      $('#quickAddModal').addEventListener('click', (event) => {
        if (event.target === event.currentTarget || event.target.closest('[data-close-quick-add]')) closeQuickAdd();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !$('#quickAddModal').hidden) closeQuickAdd();
      });

      $('#list').addEventListener('click', async (event) => {
        const target = event.target.closest('button');
        if (!target) return;

        if (target.dataset.test) {
          const id = target.dataset.test;
          target.disabled = true;
          const result = await testProxy(id);
          if (!result.samples.some((sample) => Number.isFinite(sample))) alert(result.error || '代理测试失败');
          target.disabled = false;
          return;
        }

        if (target.dataset.schedule) {
          const account = state.accounts.find((item) => String(item.id) === String(target.dataset.schedule));
          if (!account) return;
          await toggleSchedule(account, target);
        }
      });

      $('#quickGroups').addEventListener('change', (event) => {
        const input = event.target.closest('input[data-quick-group]');
        if (!input) return;
        const id = String(input.dataset.quickGroup);
        if (input.checked) state.quickGroupIDs.add(id);
        else state.quickGroupIDs.delete(id);
        updateQuickGroupSummary();
        renderQuickCards();
      });

      $('#quickCards').addEventListener('click', async (event) => {
        const target = event.target.closest('button[data-quick-schedule]');
        if (!target) return;
        const account = state.accounts.find((item) => String(item.id) === String(target.dataset.quickSchedule));
        if (account) await toggleSchedule(account, target);
      });

      $('#list').addEventListener('change', (event) => {
        if (!event.target.dataset.select) return;
        const id = String(event.target.dataset.select);
        if (event.target.checked) state.selected.add(id);
        else state.selected.delete(id);
        $('#selected').textContent = '已选 ' + state.selected.size + ' 个账号';
        $('#move').disabled = state.selected.size === 0;
      });

      $('#move').addEventListener('click', async () => {
        const ids = [...state.selected].map(Number);
        const selectedTarget = $('#target').value;
        if (!ids.length) return;
        if (!selectedTarget) return alert('请选择目标代理');

        const isUncategorized = selectedTarget === '__uncategorized';
        const proxy = state.proxies.find((item) => String(proxyId(item)) === selectedTarget);
        const targetName = isUncategorized ? '未分类（清除代理）' : (proxy ? proxyName(proxy) + '（ID ' + selectedTarget + '）' : selectedTarget);
        const confirmation = '确认移动以下账号？\n账号 ID：' + ids.join('、') + '\n目标代理：' + targetName;
        if (!confirm(confirmation)) return;

        const button = $('#move');
        button.disabled = true;
        try {
          await api('/admin/accounts/bulk-update', {
            method: 'POST',
            body: JSON.stringify({ account_ids: ids, proxy_id: isUncategorized ? null : Number(selectedTarget) })
          });
          state.selected.clear();
          $('#target').value = '';
          await load();
        } catch (error) {
          alert(error.message || '批量移动失败');
        } finally {
          button.disabled = false;
        }
      });

      updateConnection();
      updateSummary();
      load();
    })();
  </script>
</body>
</html>
